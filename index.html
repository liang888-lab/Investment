function renderSheetImportSection(){
  const si = state.sheetImport;
  const rows = si.rows;
  const validCount = rows.filter(r=>!r.errorMsg).length;
  const includedCount = rows.filter(r=>r.include && !r.errorMsg).length;

  const rowsHtml = rows.map((r,idx)=>{
    const s = r.symbol ? getStock(r.symbol) : null;
    return `<tr style="${r.errorMsg?'opacity:0.55;':''}">
      <td>${r.rowIndex}</td>
      <td>${r.errorMsg?'':`<input type="checkbox" ${r.include?'checked':''} onchange="toggleSheetImportRow(${idx})"/>`}</td>
      <td>${escapeAttr(r.symbolRaw)}${s?` <span class="mono" style="color:var(--text-faint)">(${s.name})</span>`:''}</td>
      <td>${r.errorMsg?'－':fmt(r.shares,0)}</td>
      <td>${r.errorMsg?'－':fmt(r.totalCost,0)}</td>
      <td>${r.errorMsg||r.avgCost==null?'－':fmt(r.avgCost)}</td>
      <td>${r.date||'－'}</td>
      <td>${r.account?escapeAttr(r.account):'－'}</td>
      <td>${r.errorMsg?`<span class="down-color">${r.errorMsg}</span>`:'<span class="up-color">可匯入</span>'}</td>
    </tr>`;
  }).join('');

  return `
    <div class="card">
      <h3 style="font-size:12px; color:var(--text-dim); margin:0 0 4px;">方法一：從 Google 試算表自動匯入</h3>
      <p class="panel-hint" style="margin:0 0 12px;">
        試算表需先設定「共用」→「知道連結的任何人」可檢視；第一列請放欄位標題，系統會自動比對這些欄位（不限順序、可中英文）：<b>代號</b>（股票代號或名稱）、<b>股數</b>、<b>總成本</b>（這檔股票總共花了多少錢買進，不是每股平均成本）、<b>日期</b>（選填，起始持有日期）、<b>帳戶</b>（選填，例如台新／凱基／國泰，同一檔股票在不同帳戶請分開列）。
        每次按「重新整理」＋「確認匯入」，都會<b>整批取代</b>先前透過這個功能匯入的全部資料（不論哪一檔股票、哪個帳戶），改成這次試算表裡的最新內容，所以放心重複抓取，不會疊加成兩倍股數；但完全不會動到你手動新增的一般買賣交易。
      </p>
      <div class="field-grid" style="grid-template-columns: 1fr;">
        <div>
          <label>Google 試算表連結</label>
          <input type="text" id="sheet-import-url" placeholder="https://docs.google.com/spreadsheets/d/..." value="${escapeAttr(si.url)}" oninput="updateSheetImportUrl(this.value)"/>
        </div>
      </div>
      <button class="btn" style="margin-top:10px;" onclick="fetchSheetImport()" ${si.loading?'disabled':''}>${si.loading?'讀取中…':'重新整理'}</button>
      ${si.error ? `<div class="warn-box" style="margin-top:10px;">${escapeAttr(si.error)}</div>` : ''}
      ${si.fetchedAt && !si.error ? `<div class="panel-hint" style="margin:8px 0 0;">最後讀取時間：${new Date(si.fetchedAt).toLocaleString('zh-TW')}，共解析到 ${rows.length} 列，其中 ${validCount} 列格式正確</div>` : ''}
      ${rows.length ? `
        <div class="card" style="padding:0; overflow-x:auto; margin-top:12px;">
          <table>
            <thead><tr><th>列</th><th>匯入</th><th>股票</th><th>股數</th><th>總成本</th><th>換算均價</th><th>日期</th><th>帳戶</th><th>狀態</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        <button class="btn" style="margin-top:10px;" onclick="confirmSheetImport()" ${(includedCount && !si.importing)?'':'disabled'}>${si.importing ? '匯入中，查詢股價與名稱…' : `確認匯入已勾選的 ${includedCount} 筆`}</button>
      ` : ''}
    </div>
  `;
}

      <h3 style="font-size:12px; color:var(--text-dim); margin:0 0 4px;">方法一：從 Google 試算表自動匯入</h3>
      <p class="panel-hint" style="margin:0 0 12px;">
        試算表需先設定「共用」→「知道連結的任何人」可檢視；第一列請放欄位標題，系統會自動比對這些欄位（不限順序、可中英文）：<b>股票代號</b>、<b>損益金額</b>（虧損請填負數）、<b>交易日期</b>。這裡匯入的都會記為「交易損益」類別。
        每次按「重新整理」都會用試算表最新內容，取代先前透過此功能匯入的全部紀錄，所以放心重複抓取；但不會動到你手動用下方表單新增的紀錄。
      </p>
      <div class="field-grid" style="grid-template-columns: 1fr;">
        <div>
          <label>Google 試算表連結</label>

      <button class="btn" style="margin-top:10px;" onclick="fetchPlSheetImport()" ${si.loading?'disabled':''}>${si.loading?'讀取中…':'重新整理'}</button>
      ${si.error ? `<div class="warn-box" style="margin-top:10px;">${escapeAttr(si.error)}</div>` : ''}
      ${si.fetchedAt && !si.error ? `<div class="panel-hint" style="margin:8px 0 0;">最後讀取時間：${new Date(si.fetchedAt).toLocaleString('zh-TW')}，共解析到 ${rows.length} 列，其中 ${validCount} 列格式正確</div>` : ''}
      ${rows.length ? `
        <div class="card" style="padding:0; overflow-x:auto; margin-top:12px;">
          <table>
            <thead><tr><th>列</th><th>匯入</th><th>股票</th><th>損益金額</th><th>交易日期</th><th>狀態</th></tr></thead>
            <tbody>${rowsHtml}</tbody>

}

function renderPortfolioTab(){
  const accounts = Array.from(new Set(state.transactions.map(t=>t.account||'未分類'))).sort();
  const showAccountTabs = accounts.length > 1 || (accounts.length===1 && accounts[0] !== '未分類');
  const selectedAccount = state.portfolioAccountFilter;
  const { holdings: holdingsMap } = computeHoldings(selectedAccount);
  const openSymbols = Object.keys(holdingsMap).filter(sym=>holdingsMap[sym].shares>0).sort((a,b)=>a.localeCompare(b, undefined, { numeric:true }));
  const allRealized = Object.values(holdingsMap).reduce((sum,h)=>sum+h.realizedPL, 0);

  const accountTabsHtml = showAccountTabs ? `
    <div class="group-tabs" style="margin-bottom:12px;">
      <button class="group-tab ${selectedAccount==='全部'?'active':''}" onclick="selectPortfolioAccount('全部')">全部帳戶</button>
      ${accounts.map(a=>`<button class="group-tab ${selectedAccount===a?'active':''}" onclick="selectPortfolioAccount('${escapeAttr(a)}')">${escapeAttr(a)}</button>`).join('')}
    </div>
  ` : '';

  if(!openSymbols.length){
    return `${renderImportHoldingsSection()}<div class="panel-section"><h3>持股總覽</h3>${accountTabsHtml}<div class="card">
      ${allRealized ? `<div class="result-line"><span class="rl-label">已實現損益總計</span><span class="rl-val ${allRealized>=0?'up-color':'down-color'}">${allRealized>=0?'+':''}${fmt(allRealized,0)}</span></div>` : `<div class="empty">尚無持股紀錄，可利用上方「匯入既有持股」快速建檔，或至「交易紀錄」頁籤新增買進紀錄</div>`}
    </div></div>`;
  }
  let totalCost=0, totalNetValue=0, totalGrossValue=0;
  const rows = openSymbols.map(sym=>{
    const h = holdingsMap[sym];
    const s = getStock(sym);
    const price = s ? s.price : h.avgCost;
    const name = s ? s.name : sym;
    const u = computeUnrealized(h, price, sym);
    const days = holdingDays(sym);
    totalCost += u.costBasis; totalNetValue += u.netValue; totalGrossValue += u.grossValue;
    return `<tr>
      <td>${name} <span class="mono" style="color:var(--text-faint)">${sym}</span></td>
      <td>${fmt(h.shares,0)}</td>
      <td>${fmt(h.avgCost)}</td>
      <td>${fmt(u.costBasis,0)}</td>
      <td>${fmt(price)}</td>
      <td>${fmt(u.grossValue,0)}</td>
      <td class="${u.unrealized>=0?'up-color':'down-color'}">${u.unrealized>=0?'+':''}${fmt(u.unrealized,0)}（${u.unrealizedPct>=0?'+':''}${fmt(u.unrealizedPct)}%）</td>
      <td>${days===null?'－':fmt(days,0)+' 天'}</td>
      <td><button class="alert-del" onclick="clearHoldingForSymbol('${sym}')" title="刪除這檔股票在目前篩選帳戶下的所有交易紀錄，重新開始輸入">✕</button></td>
    </tr>`;
  }).join('');
  const totalPl = totalNetValue-totalCost;
  const totalPlPct = totalCost>0 ? (totalPl/totalCost*100) : 0;

  return `
    ${renderImportHoldingsSection()}
    <div class="panel-section">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <h3 style="margin:0;">持股總覽</h3>
        <button class="btn-ghost" onclick="reconcileDuplicateSymbols()" ${state.reconciling?'disabled':''} title="如果同一檔股票因為輸入方式不同（一次打代號、一次打名稱）被拆成兩筆，用這個自動合併">${state.reconciling?'整理中…':'整理重複股票代號'}</button>
      </div>
      ${accountTabsHtml}
      <p class="panel-hint">持股成本＝股數×平均成本（已內含買進手續費，若為「期初匯入」則為你輸入的總成本）；未實現損益已另外扣除試算的賣出手續費與證交稅（費率可於「交易紀錄」頁籤調整）；持有天數以該股最早一筆交易紀錄起算。${showAccountTabs?'目前顯示「'+escapeAttr(selectedAccount)+'」的持股；':''}輸入錯誤時，最右邊 ✕ 可以刪除該檔股票（在目前篩選帳戶下）的所有交易紀錄重新輸入；如果只想刪除某一筆交易，請到「交易紀錄」頁籤操作</p>
      <div class="card" style="padding:0; overflow-x:auto;">
        <table>
          <thead><tr><th>股票</th><th>股數</th><th>均價</th><th>持股成本</th><th>現價</th><th>市值</th><th>未實現損益</th><th>持有天數</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr>
            <td>合計</td><td></td><td></td>
            <td>${fmt(totalCost,0)}</td>
            <td></td>
            <td>${fmt(totalGrossValue,0)}</td>
            <td class="${totalPl>=0?'up-color':'down-color'}">${totalPl>=0?'+':''}${fmt(totalPl,0)}（${totalPlPct>=0?'+':''}${fmt(totalPlPct)}%）</td>
            <td></td>
            <td></td>
          </tr></tfoot>
        </table>
      </div>
      ${allRealized ? `<div class="card" style="margin-top:12px;"><div class="result-line"><span class="rl-label">已實現損益總計（含已平倉部位）</span><span class="rl-val ${allRealized>=0?'up-color':'down-color'}">${allRealized>=0?'+':''}${fmt(allRealized,0)}</span></div></div>` : ''}
    </div>
  `;
}

/* ================= 匯入過去損益紀錄（依年度、區分交易損益／配息） ================= */
function updatePlImportDraft(field, value){ state.plImportDraft[field] = value; }
function addImportedPL(){
  const d = state.plImportDraft;
  const year = parseInt(d.year, 10) || new Date().getFullYear();
  if(!year){ alert('請輸入年度'); return; }
  const category = d.category;
  const amount = parseFloat(d.amount);
  if(Number.isNaN(amount)){ alert('請輸入金額（虧損請輸入負數）'); return; }
  const note = (d.note || '').trim();
  state.importedPL.push({ id: state.nextImportedPLId++, year, category, amount, note });
  state.plImportDraft.amount = '';
  state.plImportDraft.note = '';
  render();
}
function removeImportedPL(id){
  state.importedPL = state.importedPL.filter(p=>p.id!==id);
  render();
}

/* ================= 已實現損益統計（依交易紀錄＋匯入資料，年度／月份加總，區分交易損益與配息） ================= */
function renderPLSummaryTab(){
  const { realizedById, holdings } = computeHoldings();
  const sellTxs = state.transactions.filter(t=>t.type==='sell');
  const byMonth = {};
  const tradeByYear = {};
  sellTxs.forEach(t=>{
    const r = realizedById[t.id];
    if(r===undefined) return;
    const ym = t.date.slice(0,7);
    const y = t.date.slice(0,4);
    byMonth[ym] = (byMonth[ym]||0) + r;
    tradeByYear[y] = (tradeByYear[y]||0) + r;
  });

  // 手動匯入的過去損益，依年度與類別（交易損益／配息）加總；有填確切日期的（例如試算表匯入）也一併併入月份統計
  const importedTradeByYear = {};
  const importedDividendByYear = {};
  state.importedPL.forEach(p=>{
    const y = String(p.year);
    if(p.category==='dividend'){ importedDividendByYear[y] = (importedDividendByYear[y]||0) + p.amount; }
    else{
      importedTradeByYear[y] = (importedTradeByYear[y]||0) + p.amount;
      if(p.date){ const ym = p.date.slice(0,7); byMonth[ym] = (byMonth[ym]||0) + p.amount; }
    }
  });

  // 「配息」頁籤已抓取到的現金股利資料，依年度加總（尚未抓取過的年度不會出現在這裡）
  const symbols = Array.from(new Set(state.transactions.map(t=>t.symbol)));
  const dividendYearsFromCache = new Set();
  symbols.forEach(sym=>{
    const c = state.dividendCache[sym];
    if(c && c.records){
      c.records.forEach(r=>{ if(r.CashExDividendTradingDate) dividendYearsFromCache.add(r.CashExDividendTradingDate.slice(0,4)); });
    }
  });
  const autoDividendByYear = {};
  dividendYearsFromCache.forEach(y=>{
    let sum = 0;
    symbols.forEach(sym=>{
      computeDividendEvents(sym, parseInt(y,10)).forEach(ev=>{ if(ev.type==='cash') sum += ev.amount; });
    });
    if(sum) autoDividendByYear[y] = sum;
  });

  const years = Array.from(new Set([
    ...Object.keys(tradeByYear),
    ...Object.keys(importedTradeByYear),
    ...Object.keys(importedDividendByYear),
    ...Object.keys(autoDividendByYear),
  ])).sort().reverse();

  const months = Object.keys(byMonth).sort().reverse();
  const yearNow = new Date().getFullYear();

  const importedRows = [...state.importedPL].sort((a,b)=> (b.date||String(b.year)).localeCompare(a.date||String(a.year)) || b.id-a.id).map(p=>{
    const s = p.symbol ? getStock(p.symbol) : null;
    return `
    <tr>
      <td>${p.symbol ? `${s?s.name:p.symbol} <span class="mono" style="color:var(--text-faint)">${p.symbol}</span>` : '－'}</td>
      <td><span class="tag ${p.category==='dividend'?'neutral':'bull'}">${p.category==='dividend'?'配息':'交易損益'}</span></td>
      <td class="${p.amount>=0?'up-color':'down-color'}">${p.amount>=0?'+':''}${fmt(p.amount,0)}</td>
      <td style="color:var(--text-faint)">${p.note?escapeAttr(p.note):'－'}</td>
      <td>${p.date || p.year}</td>
      <td><button class="alert-del" onclick="removeImportedPL(${p.id})">✕</button></td>
    </tr>`;
  }).join('');

  const pd = state.plImportDraft;
  const importSection = `
    <div class="panel-section">
      <h3>匯入過去損益紀錄</h3>
      <p class="panel-hint">開始使用本工具前的歷史損益，可依年度手動補登、或從 Google 試算表批次匯入，並區分是「交易損益」還是「配息」的錢；補登的資料會併入下方的年度（及有填日期的話，月份）統計一起計算</p>

      ${renderPlSheetImportSection()}

      <div class="card" style="margin-top:12px;">
        <h3 style="font-size:12px; color:var(--text-dim); margin:0 0 8px;">方法二：手動逐筆輸入</h3>
        <div class="field-grid">
          <div>
            <label>年度</label>
            <input type="number" id="pl-import-year" value="${escapeAttr(pd.year || yearNow)}" min="1990" max="${yearNow}" oninput="updatePlImportDraft('year', this.value)"/>
          </div>
          <div>
            <label>類別</label>
            <select id="pl-import-category" onchange="updatePlImportDraft('category', this.value)">
              <option value="trade" ${pd.category==='trade'?'selected':''}>交易損益</option>
              <option value="dividend" ${pd.category==='dividend'?'selected':''}>配息</option>
            </select>
          </div>
          <div>
            <label>金額（虧損請輸入負數）</label>
            <input type="number" id="pl-import-amount" placeholder="例如 -5000" step="0.01" value="${escapeAttr(pd.amount)}" oninput="updatePlImportDraft('amount', this.value)"/>
          </div>
          <div>
            <label>備註（選填）</label>
            <input type="text" id="pl-import-note" placeholder="例如：舊券商 2023 年度" value="${escapeAttr(pd.note)}" oninput="updatePlImportDraft('note', this.value)"/>
          </div>
        </div>
        <button class="btn" style="margin-top:12px;" onclick="addImportedPL()">加入</button>
      </div>
      ${state.importedPL.length ? `
      <div class="collapsible-head" style="margin-top:12px;" onclick="togglePlImportedList()">
        <h3 style="margin:0; font-size:12px; color:var(--text-dim);">已匯入的紀錄（共 ${state.importedPL.length} 筆）</h3>
        <span class="collapsible-arrow">${state.plImportedListCollapsed ? '▸' : '▾'}</span>
      </div>
      ${state.plImportedListCollapsed ? '' : `
      <div class="card" style="padding:0; overflow-x:auto; margin-top:8px;">
        <table>
          <thead><tr><th>股票</th><th>類別</th><th>金額</th><th>備註</th><th>日期／年度</th><th></th></tr></thead>
          <tbody>${importedRows}</tbody>
        </table>
      </div>`}` : ''}
    </div>
  `;

  if(!years.length){
    return `${importSection}<div class="panel-section"><h3>已實現損益統計</h3><div class="card"><div class="empty">目前還沒有已實現損益紀錄，可以在上方匯入過去的損益，或到「交易紀錄」頁籤新增賣出交易</div></div></div>`;
  }

  const yearRows = years.map(y=>{
    const trade = (tradeByYear[y]||0) + (importedTradeByYear[y]||0);
    const dividend = (importedDividendByYear[y]||0) + (autoDividendByYear[y]||0);
    const total = trade + dividend;
    const expanded = state.plExpandedYear === y;
    const monthsInYear = Object.keys(byMonth).filter(m=>m.startsWith(y+'-')).sort();
    const monthSubRows = expanded ? monthsInYear.map(m=>{
      const v = byMonth[m];
      const monthLabel = parseInt(m.slice(5,7),10) + ' 月';
      return `<tr>
        <td style="padding-left:28px; color:var(--text-dim); font-weight:400;">${monthLabel}</td>
        <td class="${v>=0?'up-color':'down-color'}">${v>=0?'+':''}${fmt(v,0)}</td>
        <td></td>
        <td></td>
      </tr>`;
    }).join('') : '';
    const noMonthData = (expanded && !monthsInYear.length)
      ? `<tr><td colspan="4" style="padding-left:28px; color:var(--text-faint);">這個年度沒有帶確切日期的交易資料可以拆月份（可能都是只填年度、沒填日期的手動匯入）</td></tr>`
      : '';
    return `<tr style="cursor:pointer;" onclick="togglePlYear('${y}')">
      <td><span class="collapsible-arrow" style="margin-right:4px;">${expanded?'▾':'▸'}</span>${y}</td>
      <td class="${trade>=0?'up-color':'down-color'}">${trade>=0?'+':''}${fmt(trade,0)}</td>
      <td class="${dividend>=0?'up-color':'down-color'}">${dividend>=0?'+':''}${fmt(dividend,0)}</td>
      <td class="${total>=0?'up-color':'down-color'}">${total>=0?'+':''}${fmt(total,0)}</td>
    </tr>${monthSubRows}${noMonthData}`;
  }).join('');
  const grandTrade = years.reduce((s,y)=> s + (tradeByYear[y]||0) + (importedTradeByYear[y]||0), 0);
  const grandDividend = years.reduce((s,y)=> s + (importedDividendByYear[y]||0) + (autoDividendByYear[y]||0), 0);
  const grandTotal = grandTrade + grandDividend;

  const dividendTrackedSymbols = symbols.filter(sym=>{
    const h = holdings[sym];
    return h && h.shares>0;
  });
  const fetchedCount = dividendTrackedSymbols.filter(sym=> state.dividendCache[sym] && !state.dividendCache[sym].loading).length;
  const anyLoading = dividendTrackedSymbols.some(sym=> state.dividendCache[sym] && state.dividendCache[sym].loading);

  return `
    ${importSection}
    <div class="panel-section">
      <h3>已實現損益統計（依年度，區分交易損益／配息）</h3>

      ${dividendTrackedSymbols.length ? `
      <div class="card" style="margin-bottom:12px;">
        <div class="result-line">
          <span class="rl-label">配息資料狀態</span>
          <span class="rl-val" style="font-family:'Noto Sans TC',sans-serif; font-weight:400;">${dividendTrackedSymbols.length} 檔持股中，${fetchedCount} 檔已抓取過配息資料</span>

      <div class="card" style="padding:0; overflow-x:auto;">
        <table>
          <thead><tr><th>年度</th><th>交易損益</th><th>配息</th><th>年度合計</th></tr></thead>
          <tbody>${yearRows}</tbody>
          <tfoot><tr>
            <td>總計</td>
            <td class="${grandTrade>=0?'up-color':'down-color'}">${grandTrade>=0?'+':''}${fmt(grandTrade,0)}</td>
            <td class="${grandDividend>=0?'up-color':'down-color'}">${grandDividend>=0?'+':''}${fmt(grandDividend,0)}</td>
            <td class="${grandTotal>=0?'up-color':'down-color'}">${grandTotal>=0?'+':''}${fmt(grandTotal,0)}</td>

/* ================= 用 FinMind 查詢股價（新增觀察股時，若不是內建模擬股票池裡的代號就用這個抓） ================= */
/* ================= 台灣證交所盤中即時報價（mis.twse.com.tw，非官方文件、逆向工程得出）=================
   這個介面沒有正式文件，也沒有人保證瀏覽器能跨網域直接呼叫成功；一旦失敗就自動退回用 FinMind
   的最近收盤價（見下方 fetchFinMindPrice），確保至少還看得到合理的資料。 */
let twsePollTimer = null;
let twseSourceFailed = false; // 一旦連線失敗就先停止繼續嘗試，改用 FinMind，避免對一個壞掉的來源一直重打

function isTaiwanTradingHoursNow(){
  const d = new Date();
  const day = d.getDay(); // 0=週日...6=週六
  if(day===0 || day===6) return false;
  const mins = d.getHours()*60 + d.getMinutes();
  return mins >= 9*60 && mins <= 13*60+35; // 09:00–13:35（含收盤後幾分鐘緩衝）
}
async function fetchTWSEQuotesRaw(channels){
  const url = 'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?json=1&delay=0&_=' + Date.now() + '&ex_ch=' + encodeURIComponent(channels);
  const resp = await fetch(url);
  if(!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.json();
}
function applyTWSEQuote(out, m){
  const z = parseFloat(m.z); // 最近成交價，可能是 "-"（今天還沒成交過）
  const y = parseFloat(m.y); // 昨收
  const price = !Number.isNaN(z) ? z : (!Number.isNaN(y) ? y : null);
  if(price!=null) out[m.c] = { price, prevClose: !Number.isNaN(y) ? y : price };
}
// 先當作全部是上市（tse_）批次查一次，查不到的再當成上櫃（otc_）重試一次，兩種都涵蓋到
async function fetchTWSEQuotes(symbols){
  if(!symbols.length) return {};
  const out = {};
  const json1 = await fetchTWSEQuotesRaw(symbols.map(s=>'tse_'+s+'.tw').join('|'));
  const found = new Set();
  (json1.msgArray||[]).forEach(m=>{ found.add(m.c); applyTWSEQuote(out, m); });
  const missing = symbols.filter(s=>!found.has(s));
  if(missing.length){
    try{
      const json2 = await fetchTWSEQuotesRaw(missing.map(s=>'otc_'+s+'.tw').join('|'));
      (json2.msgArray||[]).forEach(m=> applyTWSEQuote(out, m));
    }catch(e){ /* 上櫃那批查不到就算了，不影響上市的部分 */ }
  }
  return out;
}
async function pollTWSEPrices(){
  if(!state.session.loggedIn || twseSourceFailed) return;
  if(!isTaiwanTradingHoursNow()){ state.twseStatus = 'closed'; return; }
  try{
    const symbols = state.stocks.map(s=>s.symbol);
    const quotes = await fetchTWSEQuotes(symbols);
    let updated = false;
    state.stocks.forEach(s=>{
      const q = quotes[s.symbol];
      if(q){
        s.price = q.price;
        s.prevClose = q.prevClose;
        s.history.push(q.price);
        if(s.history.length>30) s.history.shift();
        updated = true;
      }
    });
    state.twseStatus = 'ok';
    state.twseError = null;
    if(updated){
      state.lastPriceRefreshAt = new Date().toISOString();
      checkAlertNotifications();
    }
    renderUnlessTyping();
  } catch(err){
    state.twseStatus = 'error';
    state.twseError = (err && err.message) || '連線失敗（可能是瀏覽器封鎖跨網域請求，或該介面暫時無法使用）';
    twseSourceFailed = true; // 先停止繼續嘗試；使用者按「重新整理報價」時會再給它一次機會
    renderUnlessTyping();
  }
}
function startTWSEPolling(){
  if(twsePollTimer) clearInterval(twsePollTimer);
  twsePollTimer = setInterval(pollTWSEPrices, 5000);
  pollTWSEPrices(); // 立刻先打一次，不用乾等 5 秒
}
// 手動按「重新整理報價」：重新給 TWSE 一次機會；如果還是失敗，退回用 FinMind 的最近收盤價
async function manualRefreshPrices(){
  twseSourceFailed = false;
  await pollTWSEPrices();
  if(state.twseStatus === 'error' || state.twseStatus === 'closed'){
    // TWSE 沒有更新到資料（失敗，或現在非交易時段），退回抓 FinMind 的最近收盤價，至少確保資料是最新的
    await refreshAllPrices();
  }
}

async function fetchFinMindPrice(symbol){
  const end = new Date();
  const start = new Date(end.getTime() - 40*86400000); // 抓近 40 天（約可涵蓋 20+ 個交易日），供股價與走勢圖使用
  const fmt2 = d => d.toISOString().slice(0,10);
  const params = new URLSearchParams({ dataset:'TaiwanStockPrice', data_id: symbol, start_date: fmt2(start), end_date: fmt2(end) });
  const headers = {};
  if(state.finmindToken) headers['Authorization'] = 'Bearer ' + state.finmindToken;
  const resp = await fetch('https://api.finmindtrade.com/api/v4/data?' + params.toString(), { headers });
  if(!resp.ok) throw new Error('HTTP ' + resp.status);
  const json = await resp.json();
  if(json && json.status && json.status !== 200 && json.status !== '200'){
    throw new Error(json.msg || ('狀態碼 ' + json.status));
  }
  const rows = (json.data || []).slice().sort((a,b)=> String(a.date).localeCompare(String(b.date)));
  if(!rows.length) return null;
  const closes = rows.map(r=> Number(r.close ?? r.Close ?? r.Adj_Close)).filter(v=>v && !Number.isNaN(v));
  if(!closes.length) return null;
  const close = closes[closes.length-1];
  const prevClose = closes.length>1 ? closes[closes.length-2] : close;
  return { price: close, prevClose, date: rows[rows.length-1].date, series: closes.slice(-20) };
}

// 用公司名稱查對應的股票代號（FinMind 的股價 API 只認代號，不認中文名稱）。
// 整份台股清單抓一次後快取起來，避免每次新增觀察股都重新下載。
let finmindStockInfoCache = null;
async function ensureFinMindStockInfoCache(){
  if(finmindStockInfoCache) return finmindStockInfoCache;
  const headers = {};
  if(state.finmindToken) headers['Authorization'] = 'Bearer ' + state.finmindToken;
  const resp = await fetch('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo', { headers });
  if(!resp.ok) throw new Error('HTTP ' + resp.status);
  const json = await resp.json();
  finmindStockInfoCache = json.data || [];
  return finmindStockInfoCache;
}
async function lookupFinMindStockId(name){
  const cache = await ensureFinMindStockInfoCache();
  let hit = cache.find(r=> r.stock_name === name);
  if(!hit) hit = cache.find(r=> r.stock_name && r.stock_name.includes(name));
  return hit ? hit.stock_id : null;
}
// 反查：已經知道代號了，查它對應的正確中文股票名稱（用於試算表只填代號、沒填名稱的情況）
async function lookupFinMindStockName(code){
  const cache = await ensureFinMindStockInfoCache();
  const hit = cache.find(r=> r.stock_id === code);
  return hit ? hit.stock_name : null;
}
// 嘗試把使用者輸入解析成 FinMind 認得的股票代號：看起來已經像代號就直接試，抓不到再用名稱查一次；
// 如果輸入本來就只是代號（沒有中文名稱），另外反查一次正確名稱，確保畫面顯示的是公司名稱而不是代號本身
async function resolveFinMindSymbolAndPrice(rawInput, guessedSymbol){
  const looksLikeCode = /^[0-9]{2,6}[A-Za-z]{0,2}$/.test((guessedSymbol||'').trim());
  const inputLooksLikeCode = /^[0-9]{2,6}[A-Za-z]{0,2}$/.test((rawInput||'').trim());
  if(looksLikeCode){
    const result = await fetchFinMindPrice(guessedSymbol);
    if(result){
      let name = rawInput;
      if(inputLooksLikeCode){
        try{ const properName = await lookupFinMindStockName(guessedSymbol); if(properName) name = properName; }catch(e){ /* 查不到名稱就先用代號頂著，不影響股價 */ }
      }
      return { finmindId: guessedSymbol, result, name };
    }
  }
  const id = await lookupFinMindStockId(rawInput);
  if(id){
    const result = await fetchFinMindPrice(id);
    if(result) return { finmindId: id, result, name: rawInput };
  }
  return null;
}


/* ================= 配息（串接 FinMind API） ================= */
async function fetchDividends(symbol){
  state.dividendCache[symbol] = { ...(state.dividendCache[symbol]||{}), loading:true, error:null };
  render();
  try{
    const params = new URLSearchParams({ dataset:'TaiwanStockDividend', data_id: symbol, start_date:'2015-01-01' });
    const headers = {};
    if(state.finmindToken) headers['Authorization'] = 'Bearer ' + state.finmindToken;
    const resp = await fetch('https://api.finmindtrade.com/api/v4/data?' + params.toString(), { headers });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const json = await resp.json();
    if(json && json.status && json.status !== 200 && json.status !== '200'){
      throw new Error(json.msg || ('狀態碼 ' + json.status));
    }
    state.dividendCache[symbol] = { loading:false, error:null, records: json.data || [], fetchedAt: new Date().toISOString() };
  } catch(err){
    state.dividendCache[symbol] = {
      loading:false,
      error: (err && err.message) || '取得資料失敗，可能是網路限制或 FinMind 服務問題',
      records: (state.dividendCache[symbol] && state.dividendCache[symbol].records) || [],
      fetchedAt: null,
    };
  }
  render();
}
async function fetchAllDividends(){
  const symbols = Array.from(new Set(state.transactions.map(t=>t.symbol)));
  for(const sym of symbols){
    await fetchDividends(sym);
  }
}
function updateFinmindToken(val){ state.finmindToken = val; }
function updateDividendYear(val){ state.dividendYear = parseInt(val,10) || new Date().getFullYear(); render(); }
function updateDividendCutoff(val){ state.dividendAutoCutoffDate = val || ''; render(); }

// 依除權息日前一日的持股快照，判斷是否符合配息資格，回傳該年度所有符合資格的配息事件
function computeDividendEvents(symbol, year){
  const cache = state.dividendCache[symbol];
  if(!cache || !cache.records) return [];
  const cutoff = state.dividendAutoCutoffDate;
  const events = [];
  cache.records.forEach(r=>{
    const exDate = r.CashExDividendTradingDate;
    if(exDate && exDate.slice(0,4) === String(year) && (!cutoff || exDate >= cutoff)){
      const perShare = (parseFloat(r.CashEarningsDistribution)||0) + (parseFloat(r.CashStatutorySurplus)||0);
      if(perShare > 0){
        const shares = holdingsAsOf(symbol, exDate);
        if(shares > 0) events.push({ symbol, exDate, perShare, shares, amount: perShare*shares, type:'cash' });
      }
    }
    const exDateStock = r.StockExDividendTradingDate;
    if(exDateStock && exDateStock.slice(0,4) === String(year) && (!cutoff || exDateStock >= cutoff)){
      const stockPerShareValue = (parseFloat(r.StockEarningsDistribution)||0) + (parseFloat(r.StockStatutorySurplus)||0);
      if(stockPerShareValue > 0){
        const shares = holdingsAsOf(symbol, exDateStock);
        if(shares > 0){
          const newShares = shares * (stockPerShareValue/10);
          events.push({ symbol, exDate: exDateStock, perShare: stockPerShareValue, shares, newShares, type:'stock' });
        }
      }
    }
  });
  return events.sort((a,b)=>a.exDate.localeCompare(b.exDate));
}

function renderDividendTab(){
  const year = state.dividendYear;
  const symbols = Array.from(new Set(state.transactions.map(t=>t.symbol)));
  const curYear = new Date().getFullYear();
  const yearOptions = [];
  for(let y=curYear; y>=curYear-5; y--) yearOptions.push(y);

  let totalCash = 0;
  const eventRows = [];
  symbols.forEach(sym=>{
    const events = computeDividendEvents(sym, year);
    const s = getStock(sym);
    events.forEach(ev=>{
      if(ev.type==='cash'){
        totalCash += ev.amount;
        eventRows.push(`<tr>
          <td>${ev.exDate}</td>
          <td>${s?s.name:sym} <span class="mono" style="color:var(--text-faint)">${sym}</span></td>
          <td>現金股利</td>
          <td>${fmt(ev.perShare,4)}</td>
          <td>${fmt(ev.shares,0)}</td>
          <td class="up-color">+${fmt(ev.amount,0)}</td>
        </tr>`);
      } else {
        eventRows.push(`<tr>
          <td>${ev.exDate}</td>
          <td>${s?s.name:sym} <span class="mono" style="color:var(--text-faint)">${sym}</span></td>
          <td>股票股利</td>
          <td>${fmt(ev.perShare,4)}</td>
          <td>${fmt(ev.shares,0)}</td>
          <td>另配 ${fmt(ev.newShares,0)} 股</td>
        </tr>`);
      }
    });
  });

  const cacheStatusRows = symbols.map(sym=>{
    const c = state.dividendCache[sym];
    const s = getStock(sym);
    let statusText, statusClass='';
    if(!c){ statusText = '尚未抓取'; }
    else if(c.loading){ statusText = '抓取中…'; }
    else if(c.error){ statusText = '失敗：' + c.error; statusClass='down-color'; }
    else { statusText = `已更新（${c.records.length} 筆股利紀錄）`; statusClass='up-color'; }
    return `<div class="result-line"><span class="rl-label">${s?s.name:sym}（${sym}）</span><span class="rl-val ${statusClass}" style="font-family:'Noto Sans TC',sans-serif; font-weight:400;">${statusText}</span></div>`;
  }).join('');

  return `
    <div class="panel-section">
      <h3>配息設定</h3>
      <p class="panel-hint">資料來源為 FinMind 開放 API（股利政策表 TaiwanStockDividend），需要瀏覽器連線到外部服務才能抓取，免費額度有限。若常常抓取失敗，可到 FinMind 官網申請免費 API Token 填入下方以提高額度。除了 Token（選填）之外不需要再填其他資料：查詢的股票代號會自動取用「交易紀錄」裡已經登記過的股票，所以請先確保該股票至少有一筆買進紀錄；查詢區間固定從 2015-01-01 起算；若瀏覽器所在的網路環境會擋外部連線，也會抓取失敗</p>
      <div class="card">
        <div class="grid-2">
          <div class="field">
            <label>統計年度</label>
            <select id="dividend-year" onchange="updateDividendYear(this.value)">
              ${yearOptions.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y} 年</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>FinMind API Token（選填）</label>
            <input type="text" id="finmind-token" value="${escapeAttr(state.finmindToken)}" placeholder="留空使用免費額度" oninput="updateFinmindToken(this.value)"/>
          </div>
          <div class="field">
            <label>自動計算的起始日期</label>
            <input type="date" id="dividend-cutoff" value="${escapeAttr(state.dividendAutoCutoffDate)}" onchange="updateDividendCutoff(this.value)"/>
          </div>
        </div>
        <p class="panel-hint" style="margin-top:8px; margin-bottom:0;">只有<b>這天（含）之後</b>的除息日才會自動計算配息；這天之前的除息事件系統會自動略過，不計入自動抓取的總額，避免跟你在「損益統計」頁籤手動輸入的舊資料重複計算兩次——這個日期以前的配息，請自行在那邊手動補登。</p>
        <button class="btn" style="margin-top:10px;" onclick="fetchAllDividends()">重新抓取所有持股的配息資料</button>
        <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
          <button class="btn-ghost" onclick="checkFinmindQuota()" ${state.finmindQuota.loading?'disabled':''}>${state.finmindQuota.loading?'查詢中…':'查詢目前 FinMind 額度使用量'}</button>
          <p class="panel-hint" style="margin-top:6px; margin-bottom:0;">${
            !state.finmindToken ? '需要先填上方的 FinMind Token 才能查詢（沒有 Token 的免費額度是每小時 300 次，無法查詢即時用量，只能自己抓個大概）'
            : state.finmindQuota.error ? `<span class="down-color">${escapeAttr(state.finmindQuota.error)}</span>`
            : state.finmindQuota.userCount!=null ? `目前已使用 ${fmt(state.finmindQuota.userCount,0)} / ${fmt(state.finmindQuota.limit,0)} 次${state.finmindQuota.checkedAt?`（查詢於 ${new Date(state.finmindQuota.checkedAt).toLocaleTimeString('zh-TW',{hour12:false})}）`:''}`
            : '尚未查詢過'
          }</p>
        </div>
      </div>
    </div>

    ${symbols.length ? `
    <div class="panel-section">
      <h3>資料狀態</h3>
      <div class="card">${cacheStatusRows}</div>
    </div>` : `<div class="panel-section"><div class="card"><div class="empty">請先到「交易紀錄」頁籤新增買進紀錄</div></div></div>`}

    <div class="panel-section">
      <h3>${year} 年度配息總覽</h3>
      <p class="panel-hint">依除息日前的實際持有股數自動比對配息資格；股票股利僅列出可另外取得的股數，不計入現金總額</p>
      <div class="card">
        <div class="result-line"><span class="rl-label">現金股利加總</span><span class="rl-val up-color">+${fmt(totalCash,0)}</span></div>
      </div>
      ${eventRows.length ? `
      <div class="card" style="padding:0; overflow-x:auto; margin-top:12px;">
        <table>
          <thead><tr><th>除權息日</th><th>股票</th><th>類型</th><th>每股股利</th><th>當時持有股數</th><th>金額／配股</th></tr></thead>
          <tbody>${eventRows.join('')}</tbody>
        </table>
      </div>` : `<div class="empty" style="margin-top:8px;">目前沒有符合資格的配息紀錄，請先抓取配息資料，或確認持有期間是否涵蓋除權息日</div>`}
    </div>
  `;
}

try{
  const savedSyncUrl = localStorage.getItem(SYNC_URL_KEY);
  if(savedSyncUrl) state.loginDraft.syncUrl = savedSyncUrl;
}catch(e){ /* 忽略 */ }

render();
