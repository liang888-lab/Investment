<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>股市監控台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161A;
    --surface:#1B1E23;
    --surface-2:#21252B;
    --surface-3: #262B32;
    --border:#2B2F36;
    --border-soft:#23262c;
    --text:#E8E6E0;
    --text-dim:#8B8F97;
    --text-faint:#5B5F67;
    --up:#E5484D;      /* 漲：紅 */
    --down:#2FA86A;    /* 跌：綠 */
    --accent:#E0A72E;
    --accent-dim: rgba(224,167,46,0.14);
    --up-dim: rgba(229,72,77,0.12);
    --down-dim: rgba(47,168,106,0.12);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans TC',sans-serif;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  .mono{ font-family:'IBM Plex Mono','Noto Sans TC',monospace; font-variant-numeric: tabular-nums; }
  .app{ display:flex; flex-direction:column; min-height:100vh; }

  /* ===== Top bar ===== */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand-mark{
    width:8px;height:8px;border-radius:1px;background:var(--accent);
    display:inline-block; transform: rotate(45deg);
  }
  .brand h1{ font-size:16px; font-weight:700; margin:0; letter-spacing:0.5px; }
  .brand span.sub{ color:var(--text-faint); font-size:12px; }
  .topbar-right{ display:flex; align-items:center; gap:16px; }
  .clock{ color:var(--text-dim); font-size:12px; }
  .refresh-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:6px 12px; border-radius:var(--radius); font-size:12px; cursor:pointer;
    font-family:'Noto Sans TC',sans-serif; transition: border-color .15s ease;
  }
  .refresh-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .refresh-btn:active{ transform: translateY(1px); }
  .notify-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    padding:6px 12px; border-radius:var(--radius); font-size:12px; cursor:pointer;
    font-family:'Noto Sans TC',sans-serif; display:flex; align-items:center; gap:6px;
  }
  .notify-btn.granted{ border-color:var(--down); color:var(--down); }
  .notify-btn.denied{ border-color:var(--up); color:var(--up); }
  .notify-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .notify-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; display:inline-block; }

  /* ===== Layout ===== */
  .body-grid{
    flex:1; display:grid; grid-template-columns: 250px 1fr; min-height:0;
  }
  @media (max-width: 860px){
    .body-grid{ grid-template-columns: 1fr; }
  }

  /* ===== Watchlist ===== */
  .watchlist{
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    background:var(--surface);
  }
  .watchlist-head{
    padding:10px 12px; color:var(--text-faint); font-size:11px;
    letter-spacing:0.5px; border-bottom:1px solid var(--border-soft);
  }
  .group-tabs{ display:flex; gap:4px; flex-wrap:wrap; }
  .group-tab{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    padding:4px 9px; border-radius:12px; font-size:11px; cursor:pointer;
    font-family:'Noto Sans TC',sans-serif; white-space:nowrap;
  }
  .group-tab:hover{ border-color:var(--text-dim); color:var(--text); }
  .group-tab.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .group-tab-add{
    background:transparent; border:1px dashed var(--border); color:var(--text-faint);
    padding:4px 9px; border-radius:12px; font-size:11px; cursor:pointer;
  }
  .group-tab-add:hover{ color:var(--accent); border-color:var(--accent); }
  .group-add-row{ display:flex; gap:6px; margin-top:8px; }
  .group-add-row input{
    flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:6px 8px; border-radius:var(--radius); font-size:12px; font-family:'Noto Sans TC',sans-serif;
  }
  .group-info-row{
    display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-size:11px;
  }
  .group-actions{ display:flex; gap:8px; }
  .link-btn{
    background:none; border:none; color:var(--text-faint); font-size:11px; cursor:pointer; padding:0;
    font-family:'Noto Sans TC',sans-serif; text-decoration:underline; text-underline-offset:2px;
  }
  .link-btn:hover{ color:var(--accent); }
  .watch-rows{ flex:1; overflow-y:auto; }
  .watch-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; border-left:2px solid transparent; cursor:pointer;
    border-bottom:1px solid var(--border-soft);
    position:relative;
  }
  .watch-row:hover{ background:var(--surface-2); }
  .watch-row.active{ background:var(--surface-2); border-left-color:var(--accent); }
  .watch-row .wl-left{ display:flex; flex-direction:column; gap:2px; }
  .watch-row .wl-name{ font-size:13px; font-weight:500; }
  .watch-row .wl-symbol{ font-size:11px; color:var(--text-faint); }
  .watch-row .wl-right{ text-align:right; display:flex; flex-direction:column; gap:2px; }
  .watch-row .wl-price{ font-size:13px; font-weight:600; }
  .watch-row .wl-chg{ font-size:11px; }
  .watch-row .wl-remove{
    position:absolute; right:6px; top:6px; width:16px; height:16px; border-radius:2px;
    display:none; align-items:center; justify-content:center; color:var(--text-faint);
    font-size:12px; background:var(--surface-3);
  }
  .watch-row:hover .wl-remove{ display:flex; }
  .wl-remove:hover{ color:var(--up); }
  .up-color{ color:var(--up); }
  .down-color{ color:var(--down); }

  .add-stock{ padding:10px 16px; border-top:1px solid var(--border-soft); }
  .add-stock-top{ border-top:none; border-bottom:1px solid var(--border-soft); }
  .add-stock button:disabled{ opacity:0.6; cursor:default; }
  .add-stock select, .add-stock input, .add-stock button{
    width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    padding:7px 8px; border-radius:var(--radius); font-size:12px; font-family:'Noto Sans TC',sans-serif;
  }
  .add-stock button{ margin-top:6px; cursor:pointer; color:var(--accent); border-color:var(--border); }
  .add-stock button:hover{ border-color:var(--accent); }

  /* ===== Main ===== */
  .main{ display:flex; flex-direction:column; min-width:0; }

  .detail-head{
    padding:18px 24px 14px; border-bottom:1px solid var(--border);
    display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .detail-title{ display:flex; align-items:baseline; gap:10px; }
  .detail-title h2{ margin:0; font-size:20px; font-weight:700; }
  .detail-title .sym{ color:var(--text-faint); font-size:13px; }
  .detail-price-row{ display:flex; align-items:baseline; gap:12px; margin-top:8px; }
  .detail-price{ font-size:30px; font-weight:600; }
  .detail-chg{ font-size:14px; font-weight:500; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
    padding:4px 9px; font-size:11px; color:var(--text-dim); display:flex; gap:6px; align-items:center;
  }
  .chip b{ color:var(--text); font-weight:600; }
  .spark-wrap{ min-width:180px; }
  .spark-wrap .spark-label{ font-size:11px; color:var(--text-faint); margin-bottom:4px; text-align:right; }

  /* ===== Tabs ===== */
  .tabs{ display:flex; gap:2px; padding:0 24px; border-bottom:1px solid var(--border); background:var(--surface); overflow-x:auto; }
  .tab-btn{ flex-shrink:0; }
  .tab-btn{
    background:transparent; border:none; color:var(--text-dim); padding:11px 14px; font-size:13px;
    cursor:pointer; border-bottom:2px solid transparent; font-family:'Noto Sans TC',sans-serif;
  }
  .tab-btn:hover{ color:var(--text); }
  .tab-btn.active{ color:var(--text); border-bottom-color:var(--accent); font-weight:600; }

  .tab-panel{ padding:22px 24px 40px; overflow-y:auto; flex:1; }
  .panel-section{ margin-bottom:22px; }
  .panel-section h3{ font-size:13px; font-weight:600; margin:0 0 10px; color:var(--text); }
  .panel-hint{ color:var(--text-faint); font-size:12px; margin: -4px 0 14px; }
  .field-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap:10px 12px; margin-top:12px; align-items:end;
  }
  .collapsible-head{
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
    margin-bottom:8px; user-select:none;
  }
  .collapsible-arrow{ color:var(--text-faint); font-size:12px; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
  }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .grid-2{ grid-template-columns:1fr; } }

  label{ display:block; font-size:11px; color:var(--text-dim); margin-bottom:4px; }
  input[type=number], input[type=text], input[type=date], select{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:8px 9px; border-radius:var(--radius); font-family:'IBM Plex Mono',monospace; font-size:13px;
  }
  input:focus{ outline:none; border-color:var(--accent); }
  .field{ margin-bottom:12px; }
  .btn{
    background:var(--accent-dim); border:1px solid var(--accent); color:var(--accent);
    padding:8px 14px; border-radius:var(--radius); font-size:12px; cursor:pointer; font-weight:600;
    font-family:'Noto Sans TC',sans-serif;
  }
  .btn:hover{ background:var(--accent); color:#14161A; }
  .btn-ghost{
    background:transparent; border:1px solid var(--border); color:var(--text-dim);
    padding:7px 12px; border-radius:var(--radius); font-size:12px; cursor:pointer;
  }
  .btn-ghost:hover{ border-color:var(--text-dim); color:var(--text); }

  .result-line{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border-soft); font-size:13px; }
  .result-line:last-child{ border-bottom:none; }
  .result-line .rl-label{ color:var(--text-dim); }
  .result-line .rl-val{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .warn-box{
    margin-top:12px; padding:10px 12px; border-radius:var(--radius); font-size:12px;
    background:var(--up-dim); border:1px solid rgba(229,72,77,0.35); color:#f2a9ac;
  }
  .ok-box{
    margin-top:12px; padding:10px 12px; border-radius:var(--radius); font-size:12px;
    background:var(--down-dim); border:1px solid rgba(47,168,106,0.35); color:#8fd6ae;
  }

  /* news */
  .news-item{ padding:12px 0; border-bottom:1px solid var(--border-soft); display:flex; gap:12px; }
  .news-item:last-child{ border-bottom:none; }
  .tag{
    flex-shrink:0; align-self:flex-start; margin-top:2px; font-size:10px; padding:2px 7px; border-radius:2px; font-weight:600;
  }
  .tag.bull{ background:var(--up-dim); color:var(--up); }
  .tag.bear{ background:var(--down-dim); color:var(--down); }
  .tag.neutral{ background:var(--surface-3); color:var(--text-dim); }
  .news-body .news-title{ font-size:13px; margin-bottom:3px; }
  .news-meta{ font-size:11px; color:var(--text-faint); }

  /* alerts */
  .alert-row{
    display:flex; align-items:center; justify-content:space-between; padding:10px 0;
    border-bottom:1px solid var(--border-soft); font-size:13px;
  }
  .alert-row:last-child{ border-bottom:none; }
  .alert-left{ display:flex; align-items:center; gap:10px; }
  .alert-type{ font-size:10px; padding:2px 7px; border-radius:2px; font-weight:600; background:var(--surface-3); color:var(--text-dim); }
  .alert-type.hit{ background:var(--accent-dim); color:var(--accent); }
  .alert-del{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; }
  .alert-del:hover{ color:var(--up); }
  .add-alert-row{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .add-alert-row select, .add-alert-row input{ width:auto; flex:1; min-width:90px; }

  /* portfolio table */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:right; font-size:11px; color:var(--text-faint); font-weight:500; padding:8px 6px; border-bottom:1px solid var(--border); }
  th:first-child, td:first-child{ text-align:left; }
  td{ text-align:right; padding:9px 6px; border-bottom:1px solid var(--border-soft); font-family:'IBM Plex Mono',monospace; }
  tfoot td{ border-top:1px solid var(--border); border-bottom:none; font-weight:600; padding-top:12px; }

  .empty{ color:var(--text-faint); font-size:12px; padding:16px 0; text-align:center; }
  .footnote{ padding:14px 24px; border-top:1px solid var(--border); color:var(--text-faint); font-size:11px; }
</style>
</head>

/* ================= 持股計算（由交易紀錄推導） ================= */
// 買進成本會自動內含買進手續費；賣出時若該筆交易有手動輸入的已實現損益，優先採用該金額，
// 否則依目前費率設定（手續費＋證交稅）自動試算。回傳持股表，以及每筆賣出交易實際採用的已實現損益（供交易紀錄頁籤顯示）。
function computeHoldings(){
  const holdings = {};
  const realizedById = {};
  const fee = state.feeSettings;
  const txs = [...state.transactions].sort((a,b)=> a.date.localeCompare(b.date) || a.id-b.id);
  txs.forEach(t=>{
    if(!holdings[t.symbol]) holdings[t.symbol] = { shares:0, avgCost:0, realizedPL:0 };
    const h = holdings[t.symbol];
    if(t.type==='buy'){
      const buyFee = t.skipFee ? 0 : Math.max(t.shares*t.price*fee.buyFeeRate, fee.minFee);
      const costAdd = t.shares*t.price + buyFee;
      const totalShares = h.shares + t.shares;
      h.avgCost = totalShares>0 ? (h.shares*h.avgCost + costAdd) / totalShares : 0;
      h.shares = totalShares;
    } else {
      const sellShares = Math.min(t.shares, h.shares);
      let realizedForThis;
      if(t.realized !== null && t.realized !== undefined && !Number.isNaN(t.realized)){
        realizedForThis = t.realized;
      } else {
        const sellValue = sellShares*t.price;
        const sellFee = Math.max(sellValue*fee.sellFeeRate, fee.minFee);
        const sellTax = sellValue*fee.taxRate;
        realizedForThis = sellValue - sellFee - sellTax - sellShares*h.avgCost;
      }
      realizedById[t.id] = realizedForThis;
      h.realizedPL += realizedForThis;
      h.shares -= sellShares;
      if(h.shares <= 0){ h.shares = 0; h.avgCost = 0; }
    }
  });
  return { holdings, realizedById };
}

// 依目前費率設定，試算某筆持股「若現在全部賣出」的稅費後未實現損益
function computeUnrealized(h, currentPrice){
  const fee = state.feeSettings;
  if(!h || h.shares<=0) return { shares:0, grossValue:0, estFee:0, estTax:0, netValue:0, costBasis:0, unrealized:0, unrealizedPct:0 };
  const grossValue = h.shares*currentPrice;
  const estFee = Math.max(grossValue*fee.sellFeeRate, fee.minFee);
  const estTax = grossValue*fee.taxRate;
  const netValue = grossValue - estFee - estTax;
  const costBasis = h.shares*h.avgCost;
  const unrealized = netValue - costBasis;
  const unrealizedPct = costBasis>0 ? (unrealized/costBasis*100) : 0;
  return { shares:h.shares, grossValue, estFee, estTax, netValue, costBasis, unrealized, unrealizedPct };
}

/* ================= 股票輸入解析（買賣交易區：可直接輸入代號或名稱） ================= */
function resolveSymbolInput(raw){
  const q = (raw||'').trim();
  if(!q) return null;
  let match = STOCK_POOL.find(s=> s.symbol.toLowerCase() === q.toLowerCase());
  if(match) return match.symbol;
  match = STOCK_POOL.find(s=> s.name === q);
  if(match) return match.symbol;
  match = STOCK_POOL.find(s=> s.name.includes(q) || q.includes(s.name));
  if(match) return match.symbol;
  return q; // 找不到就當成自訂代號，允許追蹤清單以外的股票
}
function ensureStockTracked(symbol, customName, customPrice, customPrevClose, customSeries){
  if(getStock(symbol)) return true;
  const idx = state.poolLeft.findIndex(s=>s.symbol===symbol);
  if(idx!==-1){
    const s = state.poolLeft.splice(idx,1)[0];
    state.stocks.push({ ...s, history: seedHistory(s.price) });
    return true;
  }
  if(customPrice && customPrice>0){
    const prevClose = (customPrevClose && customPrevClose>0) ? customPrevClose : customPrice;
    const history = (Array.isArray(customSeries) && customSeries.length) ? customSeries : seedHistory(customPrice);
    state.stocks.push({
      symbol, name: customName || symbol, price: customPrice, prevClose,
      earnings:'—', foreign:0, history,
    });
    return true;
  }
  return false;
}

/* ================= 持有天數：以該股最早一筆交易紀錄為準 ================= */
function firstTxDate(symbol){
  const dates = state.transactions.filter(t=>t.symbol===symbol).map(t=>t.date);
  if(!dates.length) return null;
  return dates.reduce((a,b)=> a<b?a:b);
}
function holdingDays(symbol){
  const d = firstTxDate(symbol);
  if(!d) return null;
  const start = new Date(d+'T00:00:00');
  const now = new Date();
  const diffMs = now - start;
  return Math.max(0, Math.floor(diffMs / 86400000));
}

/* ================= 持股快照：計算某日期「之前」持有的股數（配息資格判定用） ================= */
function holdingsAsOf(symbol, cutoffDateExclusive){
  let shares = 0, avgCost = 0;
  const fee = state.feeSettings;
  const txs = state.transactions
    .filter(t=>t.symbol===symbol && t.date < cutoffDateExclusive)
    .sort((a,b)=> a.date.localeCompare(b.date) || a.id-b.id);
  txs.forEach(t=>{
    if(t.type==='buy'){
      const buyFee = Math.max(t.shares*t.price*fee.buyFeeRate, fee.minFee);
      const totalShares = shares + t.shares;
      avgCost = totalShares>0 ? (shares*avgCost + t.shares*t.price + buyFee) / totalShares : 0;
      shares = totalShares;
    } else {
      shares -= Math.min(t.shares, shares);
      if(shares<=0){ shares=0; avgCost=0; }
    }
  });
  return shares;
}

  const n = new Notification('股市監控台・測試通知', {

function fireAlertNotification(alertObj, stock){
  if(!notifySupported() || Notification.permission !== 'granted') return;
  const typeLabel = alertObj.type==='target' ? '已達目標價' : '已跌破停損價';
  const n = new Notification(`${stock.name}（${stock.symbol}）${typeLabel}`, {

function checkAlertNotifications(){
  state.alerts.forEach(a=>{
    const stock = getStock(a.symbol);
    if(!stock) return;
    const hit = a.type==='target' ? stock.price >= a.price : stock.price <= a.price;
    if(hit && !state.notifiedAlerts.has(a.id)){
      fireAlertNotification(a, stock);
      state.notifiedAlerts.add(a.id);
    } else if(!hit && state.notifiedAlerts.has(a.id)){
      state.notifiedAlerts.delete(a.id);
    }
  });
}

function seedHistory(base){
  // 沒有真實歷史資料可用時的預設值：畫一條平線，不再假裝有波動
  return Array(20).fill(base);
}

/* ================= 真實股價更新（改用 FinMind 最近收盤價，不再是模擬跳動） ================= */
// 單一檔股票：抓 FinMind 最近收盤價，更新價格與（若有給）真實歷史序列
async function refreshStockPrice(stock){
  try{
    const result = await fetchFinMindPrice(stock.symbol);
    if(!result) return false;
    stock.price = result.price;
    stock.prevClose = result.prevClose;
    if(Array.isArray(result.series) && result.series.length) stock.history = result.series;
    return true;
  } catch(err){
    return false;
  }
}
// 全部觀察中的股票依序更新（刻意不用 Promise.all 平行送出，避免短時間內對 FinMind 送出太多同時請求）
async function refreshAllPrices(){
  if(state.priceRefreshing) return;
  state.priceRefreshing = true;
  renderUnlessTyping();
  let failCount = 0;
  for(const s of state.stocks){
    const ok = await refreshStockPrice(s);
    if(!ok) failCount++;
  }
  state.priceRefreshing = false;
  state.lastPriceRefreshAt = new Date().toISOString();
  state.lastPriceRefreshFailCount = failCount;
  checkAlertNotifications();
  renderUnlessTyping();
}

function fmt(n, d=2){ return Number(n).toLocaleString('zh-TW', { minimumFractionDigits:d, maximumFractionDigits:d }); }
function pct(cur, base){ return ((cur-base)/base*100); }
function getStock(sym){ return state.stocks.find(s=>s.symbol===sym); }
function chgColorClass(v){ return v >= 0 ? 'up-color' : 'down-color'; }
function chgSign(v){ return v >= 0 ? '▲' : '▼'; }

function sparkSVG(history, w=170, h=44){
  const min = Math.min(...history), max = Math.max(...history);
  const range = (max-min) || 1;
  const step = w/(history.length-1);
  const pts = history.map((v,i)=> `${(i*step).toFixed(1)},${(h - ((v-min)/range)*h).toFixed(1)}`).join(' ');
  const up = history[history.length-1] >= history[0];
  const color = up ? 'var(--up)' : 'var(--down)';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

async function addStockBySymbol(){
  const raw = (state.addStockDraft||'').trim();
  if(!raw){ alert('請輸入股票代號或名稱'); return; }
  const symbol = resolveSymbolInput(raw);

  if(ensureStockTracked(symbol)){
    finishAddStock(symbol);
    return;
  }

  // 不在內建模擬股票池：先用 FinMind 查最近收盤價（代號查不到會再試著用名稱反查代號），查不到才退回手動輸入
  state.addStockFetching = true;
  render();
  try{
    const resolved = await resolveFinMindSymbolAndPrice(raw, symbol);
    state.addStockFetching = false;
    if(resolved){
      ensureStockTracked(resolved.finmindId, resolved.name, resolved.result.price, resolved.result.prevClose, resolved.result.series);
      finishAddStock(resolved.finmindId);
      return;
    }
    const priceInput = prompt(`FinMind 查不到「${raw}」的股價資料（可能是代號或名稱打錯、興櫃股票沒有收錄，或剛好還沒有交易資料）。要改成手動輸入目前股價來建立追蹤嗎？取消則不加入。`);
    const price = parseFloat(priceInput);
    if(!price || price<=0){ render(); return; }
    ensureStockTracked(symbol, raw, price);
    finishAddStock(symbol);
  } catch(err){
    state.addStockFetching = false;
    const priceInput = prompt(`連線 FinMind 查詢股價失敗（${(err&&err.message)||'網路問題'}）。要改成手動輸入目前股價來建立追蹤嗎？取消則不加入。`);
    const price = parseFloat(priceInput);
    if(!price || price<=0){ render(); return; }
    ensureStockTracked(symbol, raw, price);
    finishAddStock(symbol);
  }
}

  const group = getActiveGroup();
  if(!group.symbols.includes(symbol)) group.symbols.push(symbol);
  if(!state.selected) state.selected = symbol;
  state.addStockDraft = '';
  render();
}

  if(state.selected === sym){

    state.selected = remaining[0];
  }
  render();
}

function avgSimResultHtml(symbol){
  const h = computeHoldings().holdings[symbol] || { shares:0, avgCost:0 };
  const shares = parseFloat(state.avgSimDraft.shares);
  const price = parseFloat(state.avgSimDraft.price);
  if(!shares || shares<=0 || !price || price<=0) return '';
  const fee = state.feeSettings;
  const buyFee = Math.max(shares*price*fee.buyFeeRate, fee.minFee);
  const costAdd = shares*price + buyFee;
  const totalShares = h.shares + shares;
  const newAvg = totalShares>0 ? (h.shares*h.avgCost + costAdd) / totalShares : 0;
  return `
    <div class="result-line"><span class="rl-label">本次所需資金（含買進手續費）</span><span class="rl-val">${fmt(costAdd,0)}</span></div>
    <div class="result-line"><span class="rl-label">加碼後總股數</span><span class="rl-val">${fmt(totalShares,0)} 股</span></div>

function addTransaction(){
  const draft = state.txDraft;
  const symbol = resolveSymbolInput(draft.symbolInput);
  if(!symbol){ alert('請輸入股票代號或名稱'); return; }
  const shares = parseFloat(draft.shares);
  if(!shares || shares<=0){ alert('請輸入股數'); return; }

  // 成交總金額若被手動修改過，以金額回推每股成交價，確保與加碼／損益計算一致
  let price;
  if(draft.amount !== '' && draft.amount !== null && draft.amountEdited){
    const amount = parseFloat(draft.amount);
    if(!amount || amount<=0){ alert('請輸入正確的成交總金額'); return; }
    price = amount/shares;
  } else {
    price = parseFloat(draft.price);
    if(!price || price<=0){ alert('請輸入成交價，或直接輸入成交總金額'); return; }
  }

  const date = draft.date || new Date().toISOString().slice(0,10);
  const type = draft.type;
  let realized = null;
  if(type==='sell'){
    const h = computeHoldings().holdings[symbol];
    if(!h || h.shares < shares){
      alert('賣出股數超過目前持有股數，請確認後再新增。');
      return;
    }
    realized = draft.realized !== '' ? parseFloat(draft.realized) : null;
  } else {
    ensureStockTracked(symbol);
  }

  state.transactions.push({ id: state.nextTransactionId++, symbol, type, shares, price, date, realized });
  state.txDraft = { date, symbolInput:'', type, shares:'', price:'', amount:'', amountEdited:false, realized:'' };
  render();
}

// 試算表需開啟「知道連結的任何人可檢視」；接受一般編輯網址或已發布的 CSV 連結。
// 欄位標題採模糊比對，不要求順序，可用中文或英文（見 HEADER_ALIASES）。
const SHEET_HEADER_ALIASES = {
  symbol: ['代號','股票代號','代碼','股票代碼','股票','symbol','stock','code'],
  shares: ['股數','持有股數','數量','symbol shares','shares','qty','quantity'],
  totalCost: ['總成本','持股總成本','總金額','成本總額','總持股成本','total cost','totalcost','cost'],
  date: ['日期','起始日期','持有日期','買進日期','交易日期','date'],
  plAmount: ['損益金額','損益','已實現損益','金額','amount','pl','profit','realized'],
};
// 簡易 CSV 解析器（自己寫的，不依賴外部函式庫，避免外部 CDN 載入失敗導致整個功能壞掉）
// 支援標準逗號分隔、雙引號欄位（含欄位內逗號、換行、跳脫雙引號 ""），第一列當標題
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else if(c === '"'){ inQuotes = true; }
    else if(c === ','){ row.push(field); field = ''; }
    else if(c === '\r'){ /* 忽略，換行由 \n 處理 */ }
    else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else { field += c; }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  while(rows.length && rows[rows.length-1].length===1 && rows[rows.length-1][0]===''){ rows.pop(); }
  if(!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1)
    .filter(r => r.length>1 || (r[0]||'').trim()!=='')
    .map(r=>{
      const obj = {};
      headers.forEach((h,idx)=>{ obj[h] = r[idx]!==undefined ? r[idx] : ''; });
      return obj;
    });
}

function buildSheetCsvUrl(rawUrl){
  const url = (rawUrl||'').trim();
  if(!url) return null;
  if(/output=csv|format=csv|tqx=out:csv/.test(url)) return url; // 已經是可直接匯出 CSV 的連結
  const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(!m) return null;
  const id = m[1];
  const gidMatch = url.match(/[?#&]gid=([0-9]+)/);
  const gid = gidMatch ? gidMatch[1] : '0';
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}`;
}
function normalizeHeaderText(h){ return String(h||'').trim().toLowerCase(); }
function findSheetHeaderKey(headers, aliasList){
  const normed = headers.map(h=>({ raw:h, norm:normalizeHeaderText(h) }));
  for(const alias of aliasList){ const hit = normed.find(h=>h.norm===alias.toLowerCase()); if(hit) return hit.raw; }
  for(const alias of aliasList){ const hit = normed.find(h=>h.norm.includes(alias.toLowerCase())); if(hit) return hit.raw; }
  return null;
}
function normalizeSheetDate(raw){
  const s = (raw||'').trim();
  if(!s) return '';
  const m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  const d = new Date(s);
  return isNaN(d.getTime()) ? '' : d.toISOString().slice(0,10);
}
function mapSheetRows(objRows){
  if(!objRows.length) return [];
  const headers = Object.keys(objRows[0]);
  const symbolKey = findSheetHeaderKey(headers, SHEET_HEADER_ALIASES.symbol);
  const sharesKey = findSheetHeaderKey(headers, SHEET_HEADER_ALIASES.shares);
  const costKey = findSheetHeaderKey(headers, SHEET_HEADER_ALIASES.totalCost);
  const dateKey = findSheetHeaderKey(headers, SHEET_HEADER_ALIASES.date);
  return objRows.map((row,i)=>{
    const symbolRaw = symbolKey ? String(row[symbolKey]||'').trim() : '';
    const sharesRaw = sharesKey ? String(row[sharesKey]||'').replace(/,/g,'').trim() : '';
    const costRaw = costKey ? String(row[costKey]||'').replace(/,/g,'').trim() : '';
    const dateRaw = dateKey ? String(row[dateKey]||'').trim() : '';
    if(!symbolRaw && !sharesRaw && !costRaw) return null; // 整列空白就跳過
    const shares = parseFloat(sharesRaw);
    const totalCost = parseFloat(costRaw);
    const avgCost = (shares>0 && totalCost>0) ? totalCost/shares : null;
    const symbol = symbolRaw ? resolveSymbolInput(symbolRaw) : null;
    const date = normalizeSheetDate(dateRaw);
    let errorMsg = null;
    if(!symbolRaw) errorMsg = '缺少股票代號／名稱';
    else if(!shares || shares<=0) errorMsg = '股數不是有效數字';
    else if(!totalCost || totalCost<=0) errorMsg = '總成本不是有效數字';
    return { rowIndex:i+2, symbolRaw, symbol, shares, totalCost, avgCost, date, errorMsg, include: !errorMsg };
  }).filter(Boolean);
}
// 「已實現損益」試算表匯入用：股票代號、損益金額、交易日期
function mapPlSheetRows(objRows){
  if(!objRows.length) return [];
  const headers = Object.keys(objRows[0]);
  const symbolKey = findSheetHeaderKey(headers, SHEET_HEADER_ALIASES.symbol);
  const amountKey = findSheetHeaderKey(headers, SHEET_HEADER_ALIASES.plAmount);
  const dateKey = findSheetHeaderKey(headers, SHEET_HEADER_ALIASES.date);
  return objRows.map((row,i)=>{
    const symbolRaw = symbolKey ? String(row[symbolKey]||'').trim() : '';
    const amountRaw = amountKey ? String(row[amountKey]||'').replace(/,/g,'').trim() : '';
    const dateRaw = dateKey ? String(row[dateKey]||'').trim() : '';
    if(!symbolRaw && !amountRaw && !dateRaw) return null; // 整列空白就跳過
    const amount = parseFloat(amountRaw);
    const symbol = symbolRaw ? resolveSymbolInput(symbolRaw) : null;
    const date = normalizeSheetDate(dateRaw);
    let errorMsg = null;
    if(!symbolRaw) errorMsg = '缺少股票代號';
    else if(amountRaw==='' || Number.isNaN(amount)) errorMsg = '損益金額不是有效數字';
    else if(!date) errorMsg = '交易日期格式看不懂';
    return { rowIndex:i+2, symbolRaw, symbol, amount, date, errorMsg, include: !errorMsg };
  }).filter(Boolean);
}
function updateSheetImportUrl(value){ state.sheetImport.url = value; }

// 匯入時，同一檔股票先前透過「匯入既有持股」建立的紀錄會被取代（用試算表最新的股數/成本），

// 不在內建模擬股票池裡的股票，會用 FinMind 查真實股價與正確的股票名稱，確保未實現損益算得出來、名稱也對得上。
async function confirmSheetImport(){
  const rows = state.sheetImport.rows.filter(r=> r.include && !r.errorMsg && r.symbol);
  if(!rows.length){ alert('沒有勾選任何可匯入的資料列'); return; }
  state.sheetImport.importing = true;
  render();
  for(const r of rows){
    if(!ensureStockTracked(r.symbol)){
      // 不在內建股票池，去 FinMind 查真實股價與名稱；查不到就退回用試算表裡的代號和你填的均價當底
      try{
        const resolved = await resolveFinMindSymbolAndPrice(r.symbolRaw, r.symbol);
        if(resolved){
          ensureStockTracked(resolved.finmindId, resolved.name, resolved.result.price, resolved.result.prevClose, resolved.result.series);
          r.symbol = resolved.finmindId; // 確保交易紀錄用的是查到的正確代號
        } else {
          ensureStockTracked(r.symbol, r.symbolRaw, r.avgCost);
        }
      } catch(err){
        ensureStockTracked(r.symbol, r.symbolRaw, r.avgCost);
      }
    }
    state.transactions = state.transactions.filter(t=> !(t.imported && t.symbol===r.symbol));
    state.transactions.push({
      id: state.nextTransactionId++, symbol: r.symbol, type:'buy',
      shares: r.shares, price: r.avgCost, date: r.date || new Date().toISOString().slice(0,10),
      realized:null, skipFee:true, imported:true, importSource:'sheet',
    });
  }
  state.sheetImport.importing = false;
  state.sheetImport.rows = [];
  render();
}

// 把目前持股（股數、換算後的總成本、最早交易日期）覆寫回 Google 試算表的「holdings」分頁，
// 需要用 Google Apps Script Web App（跟雲端同步共用同一個網址），且該網址要有 writeHoldings 這個功能
// （見「雲端同步」頁籤說明的更新版程式碼）。這是「整批覆寫」，會直接取代 holdings 分頁的全部內容。
async function pushHoldingsToSheet(){
  if(!state.sync.url){ alert('請先在「交易紀錄」頁籤的「雲端同步」填入 Apps Script 網址'); return; }
  const { holdings } = computeHoldings();
  const rows = Object.keys(holdings)
    .filter(sym=>holdings[sym].shares>0)
    .map(sym=>{
      const h = holdings[sym];
      const s = getStock(sym);
      return { symbol: sym, name: s?s.name:sym, shares: h.shares, totalCost: +(h.shares*h.avgCost).toFixed(2), date: firstTxDate(sym) || '' };
    });
  if(!confirm(`確定要用目前的 ${rows.length} 檔持股，覆寫掉試算表裡「holdings」分頁的內容嗎？這個動作會直接取代，無法復原（但不影響試算表其他分頁）。`)) return;

  state.sheetWriteback = { status:'syncing', lastAt:null, error:null };
  render();
  try{
    const headers = { 'Content-Type': 'text/plain;charset=utf-8' };
    const resp = await fetch(state.sync.url, {
      method:'POST', headers,
      body: JSON.stringify({ action:'writeHoldings', rows }),
    });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const json = await resp.json();
    if(!json || !json.ok) throw new Error((json && json.error) || '寫入失敗，請確認 Apps Script 是否已更新到支援 writeHoldings 的版本');
    state.sheetWriteback = { status:'ok', lastAt: new Date().toISOString(), error:null };
  } catch(err){
    state.sheetWriteback = { status:'error', lastAt: new Date().toISOString(), error: (err&&err.message)||'連線失敗' };
  }
  render();
}

/* ================= 本機儲存（依使用者名稱＋密碼分開存放，存到瀏覽器 localStorage） =================
   注意：這裡沒有伺服器，所有資料都只留在「這台瀏覽器」。密碼只用來對本機資料做簡單的可逆加密（XOR），
   不是真正的雲端帳號系統，也無法「忘記密碼」救回——密碼錯了就無法還原資料。 */
const OLD_STORAGE_KEY = 'stockDashboard:v1'; // 舊版（未分帳號）的資料，僅用於一次性搬移
let persistTimer = null;
let lastSaveStatus = null; // { ok:boolean, at:string, message?:string }

function strToBytes(str){ return unescape(encodeURIComponent(str)); }
function bytesToStr(bytes){ return decodeURIComponent(escape(bytes)); }
function xorBytes(byteStr, key){
  if(!key) return byteStr;
  const keyBytes = strToBytes(key);
  let out = '';
  for(let i=0;i<byteStr.length;i++){
    out += String.fromCharCode(byteStr.charCodeAt(i) ^ keyBytes.charCodeAt(i % keyBytes.length));
  }
  return out;
}
function encryptForStorage(jsonStr, password){ return btoa(xorBytes(strToBytes(jsonStr), password)); }
function decryptFromStorage(b64, password){
  try{ return bytesToStr(xorBytes(atob(b64), password)); }
  catch(e){ return null; }
}
function userStorageKey(username){ return 'stockDashboard:v1:user:' + encodeURIComponent(username.trim().toLowerCase()); }

function schedulePersist(){
  if(!state.session.loggedIn) return;
  if(persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(persistState, 300);
}
function persistState(){
  if(!state.session.loggedIn || !sessionPassword) return;
  try{
    const data = {
      version: 1,
      savedAt: new Date().toISOString(),
      watchSymbols: state.stocks.map(s=>s.symbol),
      watchStocks: state.stocks.map(s=>({ symbol:s.symbol, name:s.name, price:s.price })), // 供自訂股票（不在內建股票池）還原時使用
      watchGroups: state.watchGroups,
      activeGroupId: state.activeGroupId,
      nextGroupId: state.nextGroupId,
      selected: state.selected,
      activeTab: state.activeTab,
      transactions: state.transactions,
      nextTransactionId: state.nextTransactionId,
      feeSettings: state.feeSettings,
      alerts: state.alerts,
      nextAlertId: state.nextAlertId,
      dividendYear: state.dividendYear,
      finmindToken: state.finmindToken,
      importedPL: state.importedPL,
      nextImportedPLId: state.nextImportedPLId,
      sheetImportUrl: state.sheetImport.url,
      plSheetImportUrl: state.plSheetImport.url,
    };
    const encrypted = encryptForStorage(JSON.stringify(data), sessionPassword);
    localStorage.setItem(userStorageKey(state.session.username), encrypted);
    lastSaveStatus = { ok:true, at:data.savedAt };
    lastEncryptedForUnload = encrypted; // 供關閉分頁前的最後一次同步使用
    lastLocalSavedAt = data.savedAt;
    maybeSyncPush(encrypted);
  } catch(err){
    lastSaveStatus = { ok:false, at:new Date().toISOString(), message:(err&&err.message)||'瀏覽器拒絕寫入本機儲存' };
    console.warn('儲存到本機失敗', err);
  }
}

/* ================= 雲端同步（透過 Google Apps Script Web App，存取一份加密後的資料） =================
   伺服器只存放加密後的亂碼字串，不會知道你的密碼，也解不開內容；但要留意：只要有這個網址，
   任何人都能對同一個使用者名稱寫入或覆蓋資料（伺服器沒有真正驗證身分），請勿把網址公開分享，
   使用者名稱也建議取不容易被猜到的。
   自動同步刻意節流：本機每次修改都會馬上存到瀏覽器裡，但雲端（Apps Script／Google 試算表）
   最多一小時自動推送一次，避免把額度浪費在頻繁的背景存檔上；真的想馬上同步，用「立即同步」按鈕。 */
const SYNC_MIN_INTERVAL_MS = 60 * 60 * 1000; // 自動同步的最短間隔：1 小時
let lastEncryptedForUnload = null;
function updateSyncUrlDraft(value){ state.loginDraft.syncUrl = value; }
function maybeSyncPush(encrypted){
  if(!state.sync.url) return;
  // 用「嘗試時間」而非「成功時間」當節流依據，並在送出前就同步記錄下來——
  // 否則短時間內連續呼叫（例如連續存檔好幾次）會在第一次的網路回應還沒回來前，全部都通過節流檢查而重複送出
  const last = state.sync.lastSyncAttemptAt ? new Date(state.sync.lastSyncAttemptAt).getTime() : 0;
  if(Date.now() - last < SYNC_MIN_INTERVAL_MS) return; // 還沒到一小時，先只存本機，不打雲端
  state.sync.lastSyncAttemptAt = new Date().toISOString();
  syncPush(encrypted);
}
function syncPush(encrypted){
  const url = state.sync.url;
  if(!url || !state.session.loggedIn) return;
  state.sync.status = 'syncing';
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 刻意用 text/plain 避免瀏覽器送出 CORS 預檢請求
    body: JSON.stringify({ action:'save', username: state.session.username, encrypted }),
  })
    .then(r=>r.json())
    .then(json=>{
      state.sync.status = json && json.ok ? 'ok' : 'error';
      state.sync.error = (json && json.ok) ? null : ((json && json.error) || '雲端儲存失敗');
      state.sync.lastSyncAt = new Date().toISOString();
      renderUnlessTyping();
    })
    .catch(err=>{
      state.sync.status = 'error';
      state.sync.error = (err && err.message) || '連不上雲端同步網址';
      renderUnlessTyping();
    });
}
// 關閉分頁／重新整理前的最後一搏：用 sendBeacon（瀏覽器保證即使頁面正在關閉也會送出），
// 而不是一般的 fetch（分頁關閉時常常還沒送完就被瀏覽器砍斷）。不等回應、不更新畫面。
function flushSyncOnUnload(){
  if(!state.sync.url || !state.session.loggedIn || !lastEncryptedForUnload) return;
  try{
    const body = JSON.stringify({ action:'save', username: state.session.username, encrypted: lastEncryptedForUnload });
    const blob = new Blob([body], { type:'text/plain;charset=utf-8' });
    navigator.sendBeacon(state.sync.url, blob);
  } catch(e){ /* 盡力就好，離開頁面時失敗也沒辦法再處理 */ }
}

// 登入成功後呼叫：向雲端拉一次資料，跟本機資料比對時間戳記，較新的一份為準
async function syncPullAndMerge(localSavedAt){
  const url = state.sync.url;
  if(!url) return;
  state.sync.status = 'syncing';
  render();
  try{
    const resp = await fetch(url + (url.includes('?') ? '&' : '?') + 'action=load&username=' + encodeURIComponent(state.session.username));
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const json = await resp.json();
    if(!json || !json.ok) throw new Error((json && json.error) || '雲端回應格式錯誤');
    if(json.encrypted){
      const decoded = decryptFromStorage(json.encrypted, sessionPassword);
      let cloudData = null;
      if(decoded){ try{ cloudData = JSON.parse(decoded); }catch(e){ cloudData = null; } }
      if(!cloudData){
        state.sync.status = 'error';
        state.sync.error = '雲端資料存在，但用目前密碼解不開（可能密碼跟雲端上次儲存時不同）';
      } else {
        const cloudIsNewer = !localSavedAt || (cloudData.savedAt && cloudData.savedAt > localSavedAt);
        if(cloudIsNewer){
          resetStateForNewUser();
          applyPersistedData(cloudData);
        }
        state.sync.status = 'ok';
        state.sync.error = null;
        state.sync.lastSyncAt = new Date().toISOString();
      }
    } else {
      // 雲端還沒有這個使用者的資料：這是第一次建立雲端備份，略過自動同步節流，直接推一次
      persistState();
      if(lastEncryptedForUnload){ state.sync.lastSyncAttemptAt = new Date().toISOString(); syncPush(lastEncryptedForUnload); }
      state.sync.status = 'ok';
    }
  } catch(err){
    state.sync.status = 'error';
    state.sync.error = (err && err.message) || '連不上雲端同步網址，先使用本機資料';
  }
  renderUnlessTyping();
}
function updateSyncUrlSetting(value){
  state.sync.url = value.trim();
  try{ localStorage.setItem(SYNC_URL_KEY, state.sync.url); }catch(e){ /* 忽略 */ }
}
async function manualSyncNow(){
  if(!state.sync.url){ alert('請先在下方填入雲端同步網址'); return; }
  await syncPullAndMerge(lastLocalSavedAt); // 依實際時間戳記比對，較新的一份為準
  persistState(); // 把比對後「贏的那份」重新存回本機
  if(lastEncryptedForUnload){ state.sync.lastSyncAttemptAt = new Date().toISOString(); syncPush(lastEncryptedForUnload); } // 手動按的，略過節流，直接推一次確保雲端也一致
}

// 把解密後的資料套用到目前 state（登入、或搬移舊資料時共用）
function applyPersistedData(data){
  if(!data || typeof data !== 'object') return;
  if(Array.isArray(data.watchSymbols) && data.watchSymbols.length){
    const snapshotMap = {};
    if(Array.isArray(data.watchStocks)) data.watchStocks.forEach(s=>{ snapshotMap[s.symbol] = s; });
    state.stocks = data.watchSymbols.map(sym=>{
      const base = STOCK_POOL.find(s=>s.symbol===sym);
      if(base) return { ...base, history: seedHistory(base.price) };
      const snap = snapshotMap[sym];
      const price = (snap && snap.price>0) ? snap.price : 1;
      return { symbol:sym, name:(snap && snap.name) || sym, price, prevClose:price, earnings:'—', foreign:0, history: seedHistory(price) };
    });
    state.poolLeft = STOCK_POOL.filter(s=> !data.watchSymbols.includes(s.symbol));
  }
  if(Array.isArray(data.watchGroups) && data.watchGroups.length){
    state.watchGroups = data.watchGroups;
  } else if(Array.isArray(data.watchSymbols)){
    // 舊版資料沒有分類頁面的概念，全部歸到一個「全部」分類，避免資料看起來憑空消失
    state.watchGroups = [{ id:'g1', name:'全部', symbols: data.watchSymbols }];
  }
  if(typeof data.activeGroupId === 'string' && state.watchGroups.find(g=>g.id===data.activeGroupId)){
    state.activeGroupId = data.activeGroupId;
  } else {
    state.activeGroupId = state.watchGroups[0].id;
  }
  if(typeof data.nextGroupId === 'number') state.nextGroupId = data.nextGroupId;
  if(typeof data.selected === 'string') state.selected = data.selected;
  if(typeof data.activeTab === 'string') state.activeTab = data.activeTab;
  if(Array.isArray(data.transactions)) state.transactions = data.transactions;
  if(typeof data.nextTransactionId === 'number') state.nextTransactionId = data.nextTransactionId;
  if(data.feeSettings && typeof data.feeSettings === 'object') state.feeSettings = { ...state.feeSettings, ...data.feeSettings };
  if(Array.isArray(data.alerts)) state.alerts = data.alerts;
  if(typeof data.nextAlertId === 'number') state.nextAlertId = data.nextAlertId;
  if(typeof data.dividendYear === 'number') state.dividendYear = data.dividendYear;
  if(typeof data.finmindToken === 'string') state.finmindToken = data.finmindToken;
  if(Array.isArray(data.importedPL)) state.importedPL = data.importedPL;
  if(typeof data.nextImportedPLId === 'number') state.nextImportedPLId = data.nextImportedPLId;
  if(typeof data.sheetImportUrl === 'string') state.sheetImport.url = data.sheetImportUrl;
  if(typeof data.plSheetImportUrl === 'string') state.plSheetImport.url = data.plSheetImportUrl;
  if(!getStock(state.selected)) state.selected = state.stocks[0]?.symbol;
}
function resetStateForNewUser(){
  state.stocks = STOCK_POOL.slice(0,5).map(s=>({ ...s, history: seedHistory(s.price) }));
  state.poolLeft = STOCK_POOL.slice(5);
  state.watchGroups = [{ id:'g1', name:'全部', symbols: STOCK_POOL.slice(0,5).map(s=>s.symbol) }];

  state.groupNameDraft = '';
  state.showAddGroupForm = false;
  state.addStockDraft = '';

  state.avgSimDraft = { shares:'', price:'' };

  state.plSheetImport = { url:'', loading:false, error:null, rows:[], fetchedAt:null };

}
window.addEventListener('beforeunload', () => { persistState(); flushSyncOnUnload(); }); // 離開頁面前：本機立即存一次、雲端也用 sendBeacon 補推最後一次（不受一小時節流限制）

function updateLoginDraft(field, value){ state.loginDraft[field] = value; }
function attemptLogin(){
  const username = (state.loginDraft.username||'').trim();
  const password = state.loginDraft.password||'';
  const syncUrl = (state.loginDraft.syncUrl||'').trim();
  if(!username){ state.loginDraft.error = '請輸入使用者名稱'; render(); return; }
  if(!password){ state.loginDraft.error = '請輸入密碼'; render(); return; }

  const key = userStorageKey(username);
  let raw;
  try{ raw = localStorage.getItem(key); }
  catch(err){ state.loginDraft.error = '這個瀏覽器不支援本機儲存，無法登入'; render(); return; }

  let localSavedAt = null;

  if(!raw){
    // 找不到這個帳號的資料：視為新使用者。但如果偵測到舊版（未分帳號）的資料，詢問是否要搬過來。
    let migrated = false;
    try{
      const oldRaw = localStorage.getItem(OLD_STORAGE_KEY);
      if(oldRaw){
        const oldData = JSON.parse(oldRaw);
        if(oldData && confirm('偵測到這台瀏覽器上有舊版（尚未綁定帳號）的資料，要把它匯入到「'+username+'」這個帳號嗎？')){
          resetStateForNewUser();
          applyPersistedData(oldData);
          migrated = true;
          localSavedAt = oldData.savedAt || null;
          localStorage.removeItem(OLD_STORAGE_KEY);
        }
      }
    } catch(e){ /* 舊資料損毀就當作沒有，忽略 */ }
    if(!migrated) resetStateForNewUser();
  } else {
    const decoded = decryptFromStorage(raw, password);
    let data = null;
    if(decoded){ try{ data = JSON.parse(decoded); } catch(e){ data = null; } }
    if(!data){
      state.loginDraft.error = '密碼錯誤，或這台瀏覽器上的資料已損毀';
      render();
      return;
    }
    resetStateForNewUser();
    applyPersistedData(data);
    localSavedAt = data.savedAt || null;
  }

  state.session = { username, loggedIn:true };
  sessionPassword = password;
  state.loginDraft = { username:'', password:'', syncUrl:'', error:null };
  persistState();

  if(syncUrl){
    state.sync.url = syncUrl;
    try{ localStorage.setItem(SYNC_URL_KEY, syncUrl); }catch(e){ /* 忽略 */ }
    syncPullAndMerge(localSavedAt);
  } else {
    render();
  }
  refreshAllPrices().then(startTWSEPolling); // 先用 FinMind 抓到最近收盤價當底，完成後才開始 TWSE 輪詢，避免兩邊資料互相蓋過去
}
function logout(){
  if(!confirm('登出後需要重新輸入密碼才能取回資料，確定要登出嗎？（資料已經存在這台瀏覽器裡，不會遺失）')) return;
  persistState();
  state.session = { username:null, loggedIn:false };
  sessionPassword = null;
  resetStateForNewUser();
  state.sync = { url:'', status:'idle', lastSyncAt:null, lastSyncAttemptAt:null, error:null };
  state.sheetWriteback = { status:'idle', lastAt:null, error:null };
  state.loginDraft = { username:'', password:'', syncUrl:'', error:null };
  render();
}
function clearPersistedState(){
  if(!state.session.loggedIn) return;
  if(!confirm('確定要清除「'+state.session.username+'」在這台瀏覽器上儲存的所有資料嗎？（交易紀錄、警示、匯入紀錄等都會被清空，且無法復原，但不影響其他帳號或裝置）')) return;
  resetStateForNewUser();
  persistState(); // 立刻覆寫成空白（也會同步推上雲端，如果有設定同步網址的話）
  render();
  refreshAllPrices().then(startTWSEPolling); // 清空後這裡也會停掉輪詢，重新啟動一次
}

function renderReverseCalc(sel, h){
  const d = state.reverseDraft;
  return `
    <div class="field">
      <label>目標平均成本</label>
      <input type="number" id="target-avg" placeholder="想攤到多少價位" step="0.01" value="${escapeAttr(d.targetAvg)}" oninput="updateReverseDraft('${sel.symbol}', 'targetAvg', this.value)"/>
    </div>
    <div class="field">
      <label>預計買進價格（預設為目前股價）</label>
      <input type="number" id="target-buy-price" placeholder="${fmt(sel.price)}" step="0.01" value="${escapeAttr(d.buyPrice)}" oninput="updateReverseDraft('${sel.symbol}', 'buyPrice', this.value)"/>
    </div>
    <div id="reverse-result">${reverseResultHtml(sel.symbol)}</div>
  `;
}
function updateReverseDraft(sym, field, value){
  state.reverseDraft[field] = value;
  const box = document.getElementById('reverse-result');
  if(box) box.innerHTML = reverseResultHtml(sym);
}
function reverseResultHtml(sym){
  const sel = getStock(sym);
  const h = computeHoldings().holdings[sym] || { shares:0, avgCost:0 };
  const target = parseFloat(state.reverseDraft.targetAvg);
  const buyPrice = parseFloat(state.reverseDraft.buyPrice) || (sel ? sel.price : 0);
  if(!target || h.shares<=0){
    return h.shares<=0
      ? `<div class="warn-box">此股票尚無持股紀錄，請先在左側套用一筆加碼</div>`
      : '';
  }
  const needBelowTarget = target < h.avgCost;
  if(!needBelowTarget){
    return `<div class="warn-box">目標成本高於目前平均成本（${fmt(h.avgCost)}），不需要攤平</div>`;
  }
  if(buyPrice >= target){
    return `<div class="warn-box">買進價格需低於目標平均成本，才可能攤低均價</div>`;
  }
  const neededShares = h.shares * (h.avgCost - target) / (target - buyPrice);
  const capital = neededShares * buyPrice;
  return `
    <div class="result-line"><span class="rl-label">需加碼股數</span><span class="rl-val">約 ${fmt(neededShares,0)} 股</span></div>
    <div class="result-line"><span class="rl-label">預估所需資金</span><span class="rl-val">約 ${fmt(capital,0)} 元</span></div>
    <div class="ok-box">以 ${fmt(buyPrice)} 買進約 ${fmt(neededShares,0)} 股，平均成本可降至 ${fmt(target)}</div>
  `;
}

}

      <div class="field-grid" style="grid-template-columns: 1fr;">
        <div>

      ${si.fetchedAt && !si.error ? `<div class="panel-hint" style="margin:8px 0 0;">最後讀取時間：${new Date(si.fetchedAt).toLocaleString('zh-TW')}，共解析到 ${rows.length} 列，其中 ${validCount} 列格式正確</div>` : ''}
      ${rows.length ? `

function renderPortfolioTab(){
  const { holdings: holdingsMap } = computeHoldings();
  const openSymbols = Object.keys(holdingsMap).filter(sym=>holdingsMap[sym].shares>0);
  const allRealized = Object.values(holdingsMap).reduce((sum,h)=>sum+h.realizedPL, 0);

  if(!openSymbols.length){
    return `${renderImportHoldingsSection()}<div class="panel-section"><h3>持股總覽</h3><div class="card">
      ${allRealized ? `<div class="result-line"><span class="rl-label">已實現損益總計</span><span class="rl-val ${allRealized>=0?'up-color':'down-color'}">${allRealized>=0?'+':''}${fmt(allRealized,0)}</span></div>` : `<div class="empty">尚無持股紀錄，可利用上方「匯入既有持股」快速建檔，或至「交易紀錄」頁籤新增買進紀錄</div>`}
    </div></div>`;
  }
  let totalCost=0, totalNetValue=0, totalGrossValue=0;
  const rows = openSymbols.map(sym=>{
    const h = holdingsMap[sym];
    const s = getStock(sym);
    const price = s ? s.price : h.avgCost;
    const name = s ? s.name : sym;
    const u = computeUnrealized(h, price);
    const days = holdingDays(sym);
    totalCost += u.costBasis; totalNetValue += u.netValue; totalGrossValue += u.grossValue;
    return `<tr>
      <td>${name} <span class="mono" style="color:var(--text-faint)">${sym}</span></td>
      <td>${fmt(h.shares,0)}</td>
      <td>${fmt(h.avgCost)}</td>
      <td>${fmt(u.costBasis,0)}</td>
      <td>${fmt(price)}</td>
      <td>${fmt(u.grossValue,0)}</td>
      <td class="${u.unrealized>=0?'up-color':'down-color'}">${u.unrealized>=0?'+':''}${fmt(u.unrealized,0)}（${u.unrealizedPct>=0?'+':''}${fmt(u.unrealizedPct)}%）</td>
      <td>${days===null?'－':fmt(days,0)+' 天'}</td>
      <td><button class="alert-del" onclick="clearHoldingForSymbol('${sym}')" title="刪除這檔股票所有交易紀錄，重新開始輸入">✕</button></td>
    </tr>`;
  }).join('');
  const totalPl = totalNetValue-totalCost;
  const totalPlPct = totalCost>0 ? (totalPl/totalCost*100) : 0;

  return `
    ${renderImportHoldingsSection()}
    <div class="panel-section">
      <h3>持股總覽</h3>
      <p class="panel-hint">持股成本＝股數×平均成本（已內含買進手續費，若為「期初匯入」則為你輸入的總成本）；未實現損益已另外扣除試算的賣出手續費與證交稅（費率可於「交易紀錄」頁籤調整）；持有天數以該股最早一筆交易紀錄起算。輸入錯誤時，最右邊 ✕ 可以刪除該檔股票的所有交易紀錄重新輸入；如果只想刪除某一筆交易，請到「交易紀錄」頁籤操作</p>
      <div class="card" style="padding:0; overflow-x:auto;">
        <table>
          <thead><tr><th>股票</th><th>股數</th><th>均價</th><th>持股成本</th><th>現價</th><th>市值</th><th>未實現損益</th><th>持有天數</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr>
            <td>合計</td><td></td><td></td>
            <td>${fmt(totalCost,0)}</td>
            <td></td>
            <td>${fmt(totalGrossValue,0)}</td>
            <td class="${totalPl>=0?'up-color':'down-color'}">${totalPl>=0?'+':''}${fmt(totalPl,0)}（${totalPlPct>=0?'+':''}${fmt(totalPlPct)}%）</td>
            <td></td>
            <td></td>
          </tr></tfoot>
        </table>
      </div>
      ${allRealized ? `<div class="card" style="margin-top:12px;"><div class="result-line"><span class="rl-label">已實現損益總計（含已平倉部位）</span><span class="rl-val ${allRealized>=0?'up-color':'down-color'}">${allRealized>=0?'+':''}${fmt(allRealized,0)}</span></div></div>` : ''}
    </div>
  `;
}

/* ================= 匯入過去損益紀錄（依年度、區分交易損益／配息） ================= */
function updatePlImportDraft(field, value){ state.plImportDraft[field] = value; }
function addImportedPL(){
  const d = state.plImportDraft;
  const year = parseInt(d.year, 10) || new Date().getFullYear();
  if(!year){ alert('請輸入年度'); return; }
  const category = d.category;
  const amount = parseFloat(d.amount);
  if(Number.isNaN(amount)){ alert('請輸入金額（虧損請輸入負數）'); return; }
  const note = (d.note || '').trim();
  state.importedPL.push({ id: state.nextImportedPLId++, year, category, amount, note });
  state.plImportDraft.amount = '';
  state.plImportDraft.note = '';
  render();
}
function removeImportedPL(id){
  state.importedPL = state.importedPL.filter(p=>p.id!==id);
  render();
}

/* ================= 已實現損益統計（依交易紀錄＋匯入資料，年度／月份加總，區分交易損益與配息） ================= */
function renderPLSummaryTab(){
  const { realizedById } = computeHoldings();
  const sellTxs = state.transactions.filter(t=>t.type==='sell');
  const byMonth = {};
  const tradeByYear = {};
  sellTxs.forEach(t=>{
    const r = realizedById[t.id];
    if(r===undefined) return;
    const ym = t.date.slice(0,7);
    const y = t.date.slice(0,4);
    byMonth[ym] = (byMonth[ym]||0) + r;
    tradeByYear[y] = (tradeByYear[y]||0) + r;
  });

  // 手動匯入的過去損益，依年度與類別（交易損益／配息）加總；有填確切日期的（例如試算表匯入）也一併併入月份統計
  const importedTradeByYear = {};
  const importedDividendByYear = {};
  state.importedPL.forEach(p=>{
    const y = String(p.year);
    if(p.category==='dividend'){ importedDividendByYear[y] = (importedDividendByYear[y]||0) + p.amount; }
    else{
      importedTradeByYear[y] = (importedTradeByYear[y]||0) + p.amount;
      if(p.date){ const ym = p.date.slice(0,7); byMonth[ym] = (byMonth[ym]||0) + p.amount; }
    }
  });

  // 「配息」頁籤已抓取到的現金股利資料，依年度加總（尚未抓取過的年度不會出現在這裡）
  const symbols = Array.from(new Set(state.transactions.map(t=>t.symbol)));
  const dividendYearsFromCache = new Set();
  symbols.forEach(sym=>{
    const c = state.dividendCache[sym];
    if(c && c.records){
      c.records.forEach(r=>{ if(r.CashExDividendTradingDate) dividendYearsFromCache.add(r.CashExDividendTradingDate.slice(0,4)); });
    }
  });
  const autoDividendByYear = {};
  dividendYearsFromCache.forEach(y=>{
    let sum = 0;
    symbols.forEach(sym=>{
      computeDividendEvents(sym, parseInt(y,10)).forEach(ev=>{ if(ev.type==='cash') sum += ev.amount; });
    });
    if(sum) autoDividendByYear[y] = sum;
  });

  const years = Array.from(new Set([
    ...Object.keys(tradeByYear),
    ...Object.keys(importedTradeByYear),
    ...Object.keys(importedDividendByYear),
    ...Object.keys(autoDividendByYear),
  ])).sort().reverse();

  const months = Object.keys(byMonth).sort().reverse();
  const yearNow = new Date().getFullYear();

  const importedRows = [...state.importedPL].sort((a,b)=> (b.date||String(b.year)).localeCompare(a.date||String(a.year)) || b.id-a.id).map(p=>{
    const s = p.symbol ? getStock(p.symbol) : null;
    return `
    <tr>
      <td>${p.symbol ? `${s?s.name:p.symbol} <span class="mono" style="color:var(--text-faint)">${p.symbol}</span>` : '－'}</td>
      <td><span class="tag ${p.category==='dividend'?'neutral':'bull'}">${p.category==='dividend'?'配息':'交易損益'}</span></td>
      <td class="${p.amount>=0?'up-color':'down-color'}">${p.amount>=0?'+':''}${fmt(p.amount,0)}</td>
      <td style="color:var(--text-faint)">${p.note?escapeAttr(p.note):'－'}</td>
      <td>${p.date || p.year}</td>
      <td><button class="alert-del" onclick="removeImportedPL(${p.id})">✕</button></td>
    </tr>`;
  }).join('');

  const pd = state.plImportDraft;
  const importSection = `
    <div class="panel-section">
      <h3>匯入過去損益紀錄</h3>
      <p class="panel-hint">開始使用本工具前的歷史損益，可依年度手動補登、或從 Google 試算表批次匯入，並區分是「交易損益」還是「配息」的錢；補登的資料會併入下方的年度（及有填日期的話，月份）統計一起計算</p>

      ${renderPlSheetImportSection()}

      <div class="card" style="margin-top:12px;">
        <h3 style="font-size:12px; color:var(--text-dim); margin:0 0 8px;">方法二：手動逐筆輸入</h3>
        <div class="field-grid">
          <div>
            <label>年度</label>
            <input type="number" id="pl-import-year" value="${escapeAttr(pd.year || yearNow)}" min="1990" max="${yearNow}" oninput="updatePlImportDraft('year', this.value)"/>
          </div>
          <div>
            <label>類別</label>
            <select id="pl-import-category" onchange="updatePlImportDraft('category', this.value)">
              <option value="trade" ${pd.category==='trade'?'selected':''}>交易損益</option>
              <option value="dividend" ${pd.category==='dividend'?'selected':''}>配息</option>
            </select>
          </div>
          <div>
            <label>金額（虧損請輸入負數）</label>
            <input type="number" id="pl-import-amount" placeholder="例如 -5000" step="0.01" value="${escapeAttr(pd.amount)}" oninput="updatePlImportDraft('amount', this.value)"/>
          </div>
          <div>
            <label>備註（選填）</label>
            <input type="text" id="pl-import-note" placeholder="例如：舊券商 2023 年度" value="${escapeAttr(pd.note)}" oninput="updatePlImportDraft('note', this.value)"/>
          </div>
        </div>
        <button class="btn" style="margin-top:12px;" onclick="addImportedPL()">加入</button>
      </div>
      ${state.importedPL.length ? `
      <div class="collapsible-head" style="margin-top:12px;" onclick="togglePlImportedList()">
        <h3 style="margin:0; font-size:12px; color:var(--text-dim);">已匯入的紀錄（共 ${state.importedPL.length} 筆）</h3>
        <span class="collapsible-arrow">${state.plImportedListCollapsed ? '▸' : '▾'}</span>
      </div>
      ${state.plImportedListCollapsed ? '' : `
      <div class="card" style="padding:0; overflow-x:auto; margin-top:8px;">
        <table>
          <thead><tr><th>股票</th><th>類別</th><th>金額</th><th>備註</th><th>日期／年度</th><th></th></tr></thead>
          <tbody>${importedRows}</tbody>
        </table>
      </div>`}` : ''}
    </div>
  `;

  if(!years.length){
    return `${importSection}<div class="panel-section"><h3>已實現損益統計</h3><div class="card"><div class="empty">目前還沒有已實現損益紀錄，可以在上方匯入過去的損益，或到「交易紀錄」頁籤新增賣出交易</div></div></div>`;
  }

  const yearRows = years.map(y=>{
    const trade = (tradeByYear[y]||0) + (importedTradeByYear[y]||0);
    const dividend = (importedDividendByYear[y]||0) + (autoDividendByYear[y]||0);
    const total = trade + dividend;
    return `<tr>
      <td>${y}</td>
      <td class="${trade>=0?'up-color':'down-color'}">${trade>=0?'+':''}${fmt(trade,0)}</td>
      <td class="${dividend>=0?'up-color':'down-color'}">${dividend>=0?'+':''}${fmt(dividend,0)}</td>
      <td class="${total>=0?'up-color':'down-color'}">${total>=0?'+':''}${fmt(total,0)}</td>
    </tr>`;
  }).join('');
  const grandTrade = years.reduce((s,y)=> s + (tradeByYear[y]||0) + (importedTradeByYear[y]||0), 0);
  const grandDividend = years.reduce((s,y)=> s + (importedDividendByYear[y]||0) + (autoDividendByYear[y]||0), 0);
  const grandTotal = grandTrade + grandDividend;

  const monthRows = months.map(m=>{
    const v = byMonth[m];
    return `<tr><td>${m}</td><td class="${v>=0?'up-color':'down-color'}">${v>=0?'+':''}${fmt(v,0)}</td></tr>`;
  }).join('');

  return `
    ${importSection}
    <div class="panel-section">
      <h3>已實現損益統計（依年度，區分交易損益／配息）</h3>
      <p class="panel-hint">交易損益＝「交易紀錄」頁籤中賣出交易的已實現損益＋上方手動匯入的交易損益；配息＝上方手動匯入的配息＋「配息」頁籤已抓取到的現金股利（尚未抓取過的年度會顯示為 0，可到「配息」頁籤補抓）</p>
      <div class="card" style="padding:0; overflow-x:auto;">
        <table>
          <thead><tr><th>年度</th><th>交易損益</th><th>配息</th><th>年度合計</th></tr></thead>
          <tbody>${yearRows}</tbody>
          <tfoot><tr>
            <td>總計</td>
            <td class="${grandTrade>=0?'up-color':'down-color'}">${grandTrade>=0?'+':''}${fmt(grandTrade,0)}</td>
            <td class="${grandDividend>=0?'up-color':'down-color'}">${grandDividend>=0?'+':''}${fmt(grandDividend,0)}</td>
            <td class="${grandTotal>=0?'up-color':'down-color'}">${grandTotal>=0?'+':''}${fmt(grandTotal,0)}</td>
          </tr></tfoot>
        </table>
      </div>
      <div class="collapsible-head" style="margin-top:16px;" onclick="togglePlMonthlyView()">
        <h3 style="margin:0; font-size:13px;">交易損益（依月份）</h3>
        <span class="collapsible-arrow">${state.plMonthlyCollapsed ? '▸' : '▾'}</span>
      </div>
      ${state.plMonthlyCollapsed ? `
        <p class="panel-hint" style="cursor:pointer; margin-top:6px;" onclick="togglePlMonthlyView()">平常看年度數字就夠了，點這裡展開看每個月的明細</p>
      ` : `
        <p class="panel-hint" style="margin-top:6px;">「交易紀錄」頁籤中賣出交易的已實現損益，加上上方手動匯入時有填「交易日期」的紀錄（只填年度、沒填日期的匯入資料不會出現在月份裡，只會算進年度總計）</p>
        <div class="card" style="padding:0; overflow-x:auto; max-height:420px; overflow-y:auto;">
          <table>
            <thead><tr><th>月份</th><th>已實現損益</th></tr></thead>
            <tbody>${monthRows || `<tr><td colspan="2" style="text-align:center; color:var(--text-faint); padding:12px 0;">尚無交易紀錄</td></tr>`}</tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

/* ================= 用 FinMind 查詢股價（新增觀察股時，若不是內建模擬股票池裡的代號就用這個抓） ================= */
/* ================= 台灣證交所盤中即時報價（mis.twse.com.tw，非官方文件、逆向工程得出）=================
   這個介面沒有正式文件，也沒有人保證瀏覽器能跨網域直接呼叫成功；一旦失敗就自動退回用 FinMind
   的最近收盤價（見下方 fetchFinMindPrice），確保至少還看得到合理的資料。 */
let twsePollTimer = null;
let twseSourceFailed = false; // 一旦連線失敗就先停止繼續嘗試，改用 FinMind，避免對一個壞掉的來源一直重打

function isTaiwanTradingHoursNow(){
  const d = new Date();
  const day = d.getDay(); // 0=週日...6=週六
  if(day===0 || day===6) return false;
  const mins = d.getHours()*60 + d.getMinutes();
  return mins >= 9*60 && mins <= 13*60+35; // 09:00–13:35（含收盤後幾分鐘緩衝）
}
async function fetchTWSEQuotesRaw(channels){
  const url = 'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?json=1&delay=0&_=' + Date.now() + '&ex_ch=' + encodeURIComponent(channels);
  const resp = await fetch(url);
  if(!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.json();
}
function applyTWSEQuote(out, m){
  const z = parseFloat(m.z); // 最近成交價，可能是 "-"（今天還沒成交過）
  const y = parseFloat(m.y); // 昨收
  const price = !Number.isNaN(z) ? z : (!Number.isNaN(y) ? y : null);
  if(price!=null) out[m.c] = { price, prevClose: !Number.isNaN(y) ? y : price };
}
// 先當作全部是上市（tse_）批次查一次，查不到的再當成上櫃（otc_）重試一次，兩種都涵蓋到
async function fetchTWSEQuotes(symbols){
  if(!symbols.length) return {};
  const out = {};
  const json1 = await fetchTWSEQuotesRaw(symbols.map(s=>'tse_'+s+'.tw').join('|'));
  const found = new Set();
  (json1.msgArray||[]).forEach(m=>{ found.add(m.c); applyTWSEQuote(out, m); });
  const missing = symbols.filter(s=>!found.has(s));
  if(missing.length){
    try{
      const json2 = await fetchTWSEQuotesRaw(missing.map(s=>'otc_'+s+'.tw').join('|'));
      (json2.msgArray||[]).forEach(m=> applyTWSEQuote(out, m));
    }catch(e){ /* 上櫃那批查不到就算了，不影響上市的部分 */ }
  }
  return out;
}
async function pollTWSEPrices(){
  if(!state.session.loggedIn || twseSourceFailed) return;
  if(!isTaiwanTradingHoursNow()){ state.twseStatus = 'closed'; return; }
  try{
    const symbols = state.stocks.map(s=>s.symbol);
    const quotes = await fetchTWSEQuotes(symbols);
    let updated = false;
    state.stocks.forEach(s=>{
      const q = quotes[s.symbol];
      if(q){
        s.price = q.price;
        s.prevClose = q.prevClose;
        s.history.push(q.price);
        if(s.history.length>30) s.history.shift();
        updated = true;
      }
    });
    state.twseStatus = 'ok';
    state.twseError = null;
    if(updated){
      state.lastPriceRefreshAt = new Date().toISOString();
      checkAlertNotifications();
    }
    renderUnlessTyping();
  } catch(err){
    state.twseStatus = 'error';
    state.twseError = (err && err.message) || '連線失敗（可能是瀏覽器封鎖跨網域請求，或該介面暫時無法使用）';
    twseSourceFailed = true; // 先停止繼續嘗試；使用者按「重新整理報價」時會再給它一次機會
    renderUnlessTyping();
  }
}
function startTWSEPolling(){
  if(twsePollTimer) clearInterval(twsePollTimer);
  twsePollTimer = setInterval(pollTWSEPrices, 5000);
  pollTWSEPrices(); // 立刻先打一次，不用乾等 5 秒
}
// 手動按「重新整理報價」：重新給 TWSE 一次機會；如果還是失敗，退回用 FinMind 的最近收盤價
async function manualRefreshPrices(){
  twseSourceFailed = false;
  await pollTWSEPrices();
  if(state.twseStatus === 'error' || state.twseStatus === 'closed'){
    // TWSE 沒有更新到資料（失敗，或現在非交易時段），退回抓 FinMind 的最近收盤價，至少確保資料是最新的
    await refreshAllPrices();
  }
}

async function fetchFinMindPrice(symbol){
  const end = new Date();
  const start = new Date(end.getTime() - 40*86400000); // 抓近 40 天（約可涵蓋 20+ 個交易日），供股價與走勢圖使用
  const fmt2 = d => d.toISOString().slice(0,10);
  const params = new URLSearchParams({ dataset:'TaiwanStockPrice', data_id: symbol, start_date: fmt2(start), end_date: fmt2(end) });
  const headers = {};
  if(state.finmindToken) headers['Authorization'] = 'Bearer ' + state.finmindToken;
  const resp = await fetch('https://api.finmindtrade.com/api/v4/data?' + params.toString(), { headers });
  if(!resp.ok) throw new Error('HTTP ' + resp.status);
  const json = await resp.json();
  if(json && json.status && json.status !== 200 && json.status !== '200'){
    throw new Error(json.msg || ('狀態碼 ' + json.status));
  }
  const rows = (json.data || []).slice().sort((a,b)=> String(a.date).localeCompare(String(b.date)));
  if(!rows.length) return null;
  const closes = rows.map(r=> Number(r.close ?? r.Close ?? r.Adj_Close)).filter(v=>v && !Number.isNaN(v));
  if(!closes.length) return null;
  const close = closes[closes.length-1];
  const prevClose = closes.length>1 ? closes[closes.length-2] : close;
  return { price: close, prevClose, date: rows[rows.length-1].date, series: closes.slice(-20) };
}

// 用公司名稱查對應的股票代號（FinMind 的股價 API 只認代號，不認中文名稱）。
// 整份台股清單抓一次後快取起來，避免每次新增觀察股都重新下載。
let finmindStockInfoCache = null;
async function ensureFinMindStockInfoCache(){
  if(finmindStockInfoCache) return finmindStockInfoCache;
  const headers = {};
  if(state.finmindToken) headers['Authorization'] = 'Bearer ' + state.finmindToken;
  const resp = await fetch('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo', { headers });
  if(!resp.ok) throw new Error('HTTP ' + resp.status);
  const json = await resp.json();
  finmindStockInfoCache = json.data || [];
  return finmindStockInfoCache;
}
async function lookupFinMindStockId(name){
  const cache = await ensureFinMindStockInfoCache();
  let hit = cache.find(r=> r.stock_name === name);
  if(!hit) hit = cache.find(r=> r.stock_name && r.stock_name.includes(name));
  return hit ? hit.stock_id : null;
}
// 反查：已經知道代號了，查它對應的正確中文股票名稱（用於試算表只填代號、沒填名稱的情況）
async function lookupFinMindStockName(code){
  const cache = await ensureFinMindStockInfoCache();
  const hit = cache.find(r=> r.stock_id === code);
  return hit ? hit.stock_name : null;
}
// 嘗試把使用者輸入解析成 FinMind 認得的股票代號：看起來已經像代號就直接試，抓不到再用名稱查一次；
// 如果輸入本來就只是代號（沒有中文名稱），另外反查一次正確名稱，確保畫面顯示的是公司名稱而不是代號本身
async function resolveFinMindSymbolAndPrice(rawInput, guessedSymbol){
  const looksLikeCode = /^[0-9]{2,6}[A-Za-z]{0,2}$/.test((guessedSymbol||'').trim());
  const inputLooksLikeCode = /^[0-9]{2,6}[A-Za-z]{0,2}$/.test((rawInput||'').trim());
  if(looksLikeCode){
    const result = await fetchFinMindPrice(guessedSymbol);
    if(result){
      let name = rawInput;
      if(inputLooksLikeCode){
        try{ const properName = await lookupFinMindStockName(guessedSymbol); if(properName) name = properName; }catch(e){ /* 查不到名稱就先用代號頂著，不影響股價 */ }
      }
      return { finmindId: guessedSymbol, result, name };
    }
  }
  const id = await lookupFinMindStockId(rawInput);
  if(id){
    const result = await fetchFinMindPrice(id);
    if(result) return { finmindId: id, result, name: rawInput };
  }
  return null;
}


/* ================= 配息（串接 FinMind API） ================= */
async function fetchDividends(symbol){
  state.dividendCache[symbol] = { ...(state.dividendCache[symbol]||{}), loading:true, error:null };
  render();
  try{
    const params = new URLSearchParams({ dataset:'TaiwanStockDividend', data_id: symbol, start_date:'2015-01-01' });
    const headers = {};
    if(state.finmindToken) headers['Authorization'] = 'Bearer ' + state.finmindToken;
    const resp = await fetch('https://api.finmindtrade.com/api/v4/data?' + params.toString(), { headers });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const json = await resp.json();
    if(json && json.status && json.status !== 200 && json.status !== '200'){
      throw new Error(json.msg || ('狀態碼 ' + json.status));
    }
    state.dividendCache[symbol] = { loading:false, error:null, records: json.data || [], fetchedAt: new Date().toISOString() };
  } catch(err){
    state.dividendCache[symbol] = {
      loading:false,
      error: (err && err.message) || '取得資料失敗，可能是網路限制或 FinMind 服務問題',
      records: (state.dividendCache[symbol] && state.dividendCache[symbol].records) || [],
      fetchedAt: null,
    };
  }
  render();
}
async function fetchAllDividends(){
  const symbols = Array.from(new Set(state.transactions.map(t=>t.symbol)));
  for(const sym of symbols){
    await fetchDividends(sym);
  }
}
function updateFinmindToken(val){ state.finmindToken = val; }
function updateDividendYear(val){ state.dividendYear = parseInt(val,10) || new Date().getFullYear(); render(); }

// 依除權息日前一日的持股快照，判斷是否符合配息資格，回傳該年度所有符合資格的配息事件
function computeDividendEvents(symbol, year){
  const cache = state.dividendCache[symbol];
  if(!cache || !cache.records) return [];
  const events = [];
  cache.records.forEach(r=>{
    const exDate = r.CashExDividendTradingDate;
    if(exDate && exDate.slice(0,4) === String(year)){
      const perShare = (parseFloat(r.CashEarningsDistribution)||0) + (parseFloat(r.CashStatutorySurplus)||0);
      if(perShare > 0){
        const shares = holdingsAsOf(symbol, exDate);
        if(shares > 0) events.push({ symbol, exDate, perShare, shares, amount: perShare*shares, type:'cash' });
      }
    }
    const exDateStock = r.StockExDividendTradingDate;
    if(exDateStock && exDateStock.slice(0,4) === String(year)){
      const stockPerShareValue = (parseFloat(r.StockEarningsDistribution)||0) + (parseFloat(r.StockStatutorySurplus)||0);
      if(stockPerShareValue > 0){
        const shares = holdingsAsOf(symbol, exDateStock);
        if(shares > 0){
          const newShares = shares * (stockPerShareValue/10);
          events.push({ symbol, exDate: exDateStock, perShare: stockPerShareValue, shares, newShares, type:'stock' });
        }
      }
    }
  });
  return events.sort((a,b)=>a.exDate.localeCompare(b.exDate));
}

function renderDividendTab(){
  const year = state.dividendYear;
  const symbols = Array.from(new Set(state.transactions.map(t=>t.symbol)));
  const curYear = new Date().getFullYear();
  const yearOptions = [];
  for(let y=curYear; y>=curYear-5; y--) yearOptions.push(y);

  let totalCash = 0;
  const eventRows = [];
  symbols.forEach(sym=>{
    const events = computeDividendEvents(sym, year);
    const s = getStock(sym);
    events.forEach(ev=>{
      if(ev.type==='cash'){
        totalCash += ev.amount;
        eventRows.push(`<tr>
          <td>${ev.exDate}</td>
          <td>${s?s.name:sym} <span class="mono" style="color:var(--text-faint)">${sym}</span></td>
          <td>現金股利</td>
          <td>${fmt(ev.perShare,4)}</td>
          <td>${fmt(ev.shares,0)}</td>
          <td class="up-color">+${fmt(ev.amount,0)}</td>
        </tr>`);
      } else {
        eventRows.push(`<tr>
          <td>${ev.exDate}</td>
          <td>${s?s.name:sym} <span class="mono" style="color:var(--text-faint)">${sym}</span></td>
          <td>股票股利</td>
          <td>${fmt(ev.perShare,4)}</td>
          <td>${fmt(ev.shares,0)}</td>
          <td>另配 ${fmt(ev.newShares,0)} 股</td>
        </tr>`);
      }
    });
  });

  const cacheStatusRows = symbols.map(sym=>{
    const c = state.dividendCache[sym];
    const s = getStock(sym);
    let statusText, statusClass='';
    if(!c){ statusText = '尚未抓取'; }
    else if(c.loading){ statusText = '抓取中…'; }
    else if(c.error){ statusText = '失敗：' + c.error; statusClass='down-color'; }
    else { statusText = `已更新（${c.records.length} 筆股利紀錄）`; statusClass='up-color'; }
    return `<div class="result-line"><span class="rl-label">${s?s.name:sym}（${sym}）</span><span class="rl-val ${statusClass}" style="font-family:'Noto Sans TC',sans-serif; font-weight:400;">${statusText}</span></div>`;
  }).join('');

  return `
    <div class="panel-section">
      <h3>配息設定</h3>
      <p class="panel-hint">資料來源為 FinMind 開放 API（股利政策表 TaiwanStockDividend），需要瀏覽器連線到外部服務才能抓取，免費額度有限。若常常抓取失敗，可到 FinMind 官網申請免費 API Token 填入下方以提高額度。除了 Token（選填）之外不需要再填其他資料：查詢的股票代號會自動取用「交易紀錄」裡已經登記過的股票，所以請先確保該股票至少有一筆買進紀錄；查詢區間固定從 2015-01-01 起算；若瀏覽器所在的網路環境會擋外部連線，也會抓取失敗</p>
      <div class="card">
        <div class="grid-2">
          <div class="field">
            <label>統計年度</label>
            <select id="dividend-year" onchange="updateDividendYear(this.value)">
              ${yearOptions.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y} 年</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>FinMind API Token（選填）</label>
            <input type="text" id="finmind-token" value="${escapeAttr(state.finmindToken)}" placeholder="留空使用免費額度" oninput="updateFinmindToken(this.value)"/>
          </div>
        </div>
        <button class="btn" onclick="fetchAllDividends()">重新抓取所有持股的配息資料</button>
      </div>
    </div>

    ${symbols.length ? `
    <div class="panel-section">
      <h3>資料狀態</h3>
      <div class="card">${cacheStatusRows}</div>
    </div>` : `<div class="panel-section"><div class="card"><div class="empty">請先到「交易紀錄」頁籤新增買進紀錄</div></div></div>`}

    <div class="panel-section">
      <h3>${year} 年度配息總覽</h3>
      <p class="panel-hint">依除息日前的實際持有股數自動比對配息資格；股票股利僅列出可另外取得的股數，不計入現金總額</p>
      <div class="card">
        <div class="result-line"><span class="rl-label">現金股利加總</span><span class="rl-val up-color">+${fmt(totalCash,0)}</span></div>
      </div>
      ${eventRows.length ? `
      <div class="card" style="padding:0; overflow-x:auto; margin-top:12px;">
        <table>
          <thead><tr><th>除權息日</th><th>股票</th><th>類型</th><th>每股股利</th><th>當時持有股數</th><th>金額／配股</th></tr></thead>
          <tbody>${eventRows.join('')}</tbody>
        </table>
      </div>` : `<div class="empty" style="margin-top:8px;">目前沒有符合資格的配息紀錄，請先抓取配息資料，或確認持有期間是否涵蓋除權息日</div>`}
    </div>
  `;
}

// 頁面載入時，先把這台裝置記得的雲端同步網址帶入登入畫面，方便不用每次重貼
try{
  const savedSyncUrl = localStorage.getItem(SYNC_URL_KEY);
  if(savedSyncUrl) state.loginDraft.syncUrl = savedSyncUrl;
}catch(e){ /* 忽略 */ }

render();

</script>
